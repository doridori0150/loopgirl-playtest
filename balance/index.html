<script>
'use strict';
// ================= 보급 롤 (핵심) =================
function rarityRoll(){let b=run.lap<=2?0:run.lap<=4?1:2;if(hasRelic('lucky'))b+=relicTune('lucky').tier;b+=FX().rarity;const T=ODDS[Math.min(3,b)],r=Math.random()*100;return r<T[0]?0:r<T[0]+T[1]?1:2;}
function pickStudent(rar){

  const owned=run.party.find(m=>m.stu.id===s.id&&m.star<3);

 if(kind==='relic'){const rar=rarityRoll(),shown=new Set((run.shop.offers||[]).filter(o=>o&&o.kind==='relic').map(o=>o.relic.id)),base=relicPool().filter(r=>!shown.has(r.id));let pool=base.filter(r=>r.rarity===rar);if(!pool.length)pool=base; /* C-06: 한 진열에 같은 유물 두 번 금지 */
  if(pool.length){const rel=pick(pool);return {uid:uid(),kind,relic:rel,rarity:rel.rarity,cost:free?0:RELIC_COST[rel.rarity],free};}}

}
/* 라운드 3 최종 처방 ③ 승급 슬롯(BAL.promoSlot): 출격 보급 제외, 분대 정원(partyMax) 충족 후, 매 롤 5칸 중 1칸을 ★3 미만 보유 학생에서 균등 추첨. 정상 가격·무료 아님, 희귀 천장은 다른 칸에 보존, 전원 ★3 이면 일반 롤 */
function promoSlot(){
 if(!BAL.promoSlot)return -1;
 if(!econOn()&&(run.shop.kind==='launch'||run.party.length<partyMax()))return -1; /* §27.6 d ②: econ2 는 인원과 무관하게 승급 칸을 둔다 */

 const stu=pick(cands).stu,i=rnd(0,shopSlots()-1);run.shop.offers[i]={uid:uid(),kind:'student',stu,rarity:stu.rarity,cost:STUDENT_COST[stu.rarity],free:false,promo:true};return i;
}
function rollOffers(){rollOffersCore();for(const o of run.shop.offers)if(o.kind==='relic'&&run.op>=priceOf(o)){const rs=run.relicSeen||(run.relicSeen={});rs[o.relic.id]=(rs[o.relic.id]||0)+1;}} /* v1.3 계측: 유물 선택률의 분모 = 제시되고 살 수 있었던 횟수 */
/* §27.6 d 출격 고용(econ2): 후보를 공개한다 — 가능하면 딜러 · 탱커 · 서포터 한 명씩, 작전실이 있으면 한 명 더(i-2).
 * 강제(「동료 먼저」)는 없고, 고용 대신 특훈(★+1)을 살 수도 있다 */
function econLaunchOffers(){
 const n=Math.max(1,(BAL.econ.hireSlots||3)+(meta.upg.ops?1:0)),have=new Set(run.party.map(m=>m.stu.id)),picks=[];
 const take=pool=>{if(!pool.length)return;const st=pick(pool);picks.push(st);have.add(st.id);};
 const pending=curriculumPending();
 const offer=pool=>{const fresh=pool.filter(s=>pending.includes(s));take(fresh.length?[fresh[0]]:pool);};
 const roles=new Set(run.party.map(m=>m.stu.role));
 for(const role of ['tank','sup','dps']){
  if(picks.length>=n)break;if(roles.has(role))continue;
  offer(STUDENTS.filter(s=>studentUnlocked(s)&&!have.has(s.id)&&s.role===role));
 }
 while(picks.length<n){
  const pool=STUDENTS.filter(s=>studentUnlocked(s)&&!have.has(s.id));if(!pool.length)break;offer(pool);
 }
 run.shop.offers=picks.map(stu=>({uid:uid(),kind:'student',stu,rarity:stu.rarity,cost:BAL.econ.hire,abs:true,free:false,hire:true}));
 const tr=SUPPLIES.find(x=>x.id==='train');
 if(tr&&run.party.some(m=>m.star<3))run.shop.offers.push({uid:uid(),kind:'supply',supply:tr,rarity:0,cost:BAL.econ.launchTrain,abs:true,free:false});
}
function rollOffersCore(){
 if(econOn()&&run.shop.kind==='launch'){econLaunchOffers();return;}

 else run.shop.dry=hasRare?0:(run.shop.dry||0)+1;
 /* v1.3 특급: 대형 진열에 유물 1칸 보장(정상 가격 — 선택 폭만 넓힌다). 승급·보정 칸은 건드리지 않는다 */

}
const offerBudget=o=>(o.kind==='student'&&recruitedMember(o.stu.id)||o.supply?.id==='train')
 ?'upgrade':'supply';
function priceOf(o){
 if(o.free)return 0;
 const cost=econOn()?ECON.price(o.abs?o.cost:ECON.scale(o.cost),{lap:run.lap,disc:FX().shopDisc})
  :Math.ceil(o.cost*(1-FX().shopDisc)*(run.party.length>=4?BAL.party4Price:1)*shopInfl());

}
function ensureMate(){if(econOn())return; /* §27.6 d: econ2 는 출격 고용 화면이 대신한다 */ // 출격 보급 규정: 동료가 없으면 미보유 일반 학생 1칸 확정 (Codex R1 권고)
 if(run.shop.kind!=='launch'||run.party.length>=2)return;
 const unowned=o=>o.kind==='student'&&o.rarity===0&&!run.party.find(m=>m.stu.id===o.stu.id);
 if(run.shop.offers.some(unowned))return;
 const pool=STUDENTS.filter(s=>s.rarity===0&&studentUnlocked(s)&&!run.party.find(m=>m.stu.id===s.id));
 if(!pool.length)return;
 const i=rnd(0,shopSlots()-1);run.shop.offers[i]={uid:uid(),kind:'student',stu:pick(pool),rarity:0,cost:STUDENT_COST[0],free:false,guaranteed:true};
}
function openShop(kind){
 if(run.ended||run.imminent)return;
 if(econOn()&&kind==='drone'){run.pendingDrones=(run.pendingDrones||0)+1;log('📡 협회 보급 발송 — 다음 캠프에서 수령','shop');dirty=true;return;}

 if(run.shop.delivery)run.pendingDrones=0;

 if(econOn()&&run.shop.kind==='camp'){run.shop.offers=[];if(run.shop.delivery){rollOffers();ensureMate();run.hintStage=Math.max(run.hintStage,3);for(let d=0;d<run.shop.delivery;d++)run.shop.crates.push(makeCrate('D'+run.lap,d,true));}} /* 캠프는 팩만 — 진열 없음(crates 는 econCampSupply 가 채웠다) */

 const g=gate(),bonus=reason==='boss'?Math.round(BAL.bossBonus*g.reward):0,eb=evalBonus(),evMana=supplyOn()?Math.round((Math.round(manaPlay*MULT[reason])+bonus)*eb.rate):0,evSp=!econOn()&&supplyOn()?Math.round((run.level-1+(reason==='boss'?g.spBonus:0))*eb.rate):0, /* v1.3 평가 보너스(최대 +20%): SP 기준에서 구매한 추가 SP 제외 */

 run.grown=[];for(const m of run.party){if(m.growthOk&&!run.grown.includes(m.stu.id)){meta.growth[m.stu.id]=(meta.growth[m.stu.id]||0)+1;run.grown.push(m.stu.id);}}

 {const book=econOn()?(meta.best2||(meta.best2={})):meta.best,prev=book[g.id];if(!prev||score>prev.score)book[g.id]={score,rank,lap:run.lap,mana:gained};}

const validSortie=r=>!!(r&&(typeof META_V2!=='undefined'?META_V2.progress(r).packs>0:(r.wins||0)>0));
function voidRun(reason){
 for(const id of run.codexNew||[])delete meta.codex[id];

<script>
'use strict';
// ================= 내장 밸런스 시뮬레이터 (타이틀 🧪 / 콘솔 GL.sim) =================
function buyDrink(){const d=run.shop.offers.find(o=>!o.sold&&o.kind==='supply'&&o.supply.id==='drink'&&run.op>=priceOf(o));if(d)buy(d.uid);}
function synergyGainIf(stu){const before=synergies().filter(s=>s.on).length;run.party.push({uid:-1,stu,star:1,down:false});const after=synergies().filter(s=>s.on).length;run.party.pop();return after-before;}
function memberValue(m){return m.star*3+m.stu.rarity*2+synergies().filter(s=>s.on&&(s.id===m.stu.club||s.id===m.stu.role)).length*2;}
function offerScore(o){
 if(o.sold||run.op<priceOf(o))return -1;
 if(o.kind==='student'){if(simRoles&&!simRoleOk(o.stu))return -1;const owned=run.party.find(m=>m.stu.id===o.stu.id);
  if(owned)return owned.star>=3?-1:9+o.rarity*2+owned.star;
  const g=synergyGainIf(o.stu);
  if(run.party.length<2)return 20+o.rarity; // 혼자면 동료가 최우선 (Codex R1)
  if(run.party.length<partyMax())return 6+o.rarity*3+g*4+(BAL.form2?f2BuyBonus(o.stu):0); /* §28 켬: 탱커·서포터 빈자리 가산 */
  const weakest=run.party.reduce((a,b)=>memberValue(a)<=memberValue(b)?a:b);
  return g>0&&weakest.star===1&&memberValue(weakest)<=3?4+o.rarity+g*3:-1;}
 if(o.kind==='relic')return run.relics.length>=BAL.relicSlots?-1:simRelicScore(o.relic.id);
 const s=o.supply.id;
 if(s==='drink')return alive().some(m=>m.hp<m.maxHp*0.6)||run.party.some(m=>m.down)?8:0;
 if(s==='ward')return simLand==='use'&&run.hand.length<=5?3:0;
 return s==='ammo'?3:s==='crystal'?2:1;
}
// 배치 정책 (시뮬): none = 안 놓음 / select = 선별 / all = 전량
const PLACE={
 none(){simTerrain();while(run.hand.length>=7)discardCard(run.hand.length-1);},
 select(){ // 효과 기반: 미리보기 점수가 가장 높은 타일에 배치
  simTerrain();
  for(let g=0;g<8;g++){
   const valid=run.tiles.filter(canPlace);if(!valid.length||!run.hand.length)break;
   const sp=spawnTiles(true).length;let idx=-1;
   if(run.t>60&&sp<dangerFreeNow())idx=run.hand.findIndex(id=>CARDS[id].spawn);
   if(idx<0&&run.t>40){ // 지원 카드: 연결 가능한 포탑/텐트 → 편의점·광맥·비콘 순
    const cands=run.hand.map((id,i)=>({id,i})).filter(x=>!CARDS[x.id].spawn&&!isTerrain(x.id)&&!(x.id==='beacon'&&run.tiles.some(t=>t.card==='beacon')));
    let bestC=null,bcs=-1e9;for(const x of cands){let m=-1e9;for(const t of valid){const s=scoreTile(x.id,t);if(s>m)m=s;}if(m>bcs){bcs=m;bestC=x;}} /* 지원 카드: 연결 가능한 sup → 진입·패시브 순 (scoreTile) */
    if(bestC&&bcs>0)idx=bestC.i;else if(bestC&&run.hand.length>=7){discardCard(bestC.i);continue;}
   }
   if(idx<0){if(run.hand.length>=7)discardCard(run.hand.length-1);break;}
   const id=run.hand[idx];let best=null,bs=-1e9;for(const t of valid){const s=scoreTile(id,t)+Math.random()*0.5;if(s>bs){bs=s;best=t;}}
   placeCard(best,idx);
  }
 },
 selectRand(){ // 비교용(구 정책): 임의 인접 타일
  simTerrain();
  for(let g=0;g<8;g++){
   const valid=run.tiles.filter(canPlace);if(!valid.length||!run.hand.length)break;
   const sp=spawnTiles(true).length;let idx=-1;
   if(run.t>60&&sp<3)idx=run.hand.findIndex(id=>CARDS[id].spawn);
   if(idx<0&&run.t>40)idx=run.hand.findIndex(id=>!CARDS[id].spawn&&!isTerrain(id)&&!(id==='beacon'&&run.tiles.some(t=>t.card==='beacon')));
   if(idx<0){if(run.hand.length>=7)discardCard(run.hand.length-1);break;}

   else{const sps=spawnTiles(false);const adj=valid.filter(t=>sps.some(s=>Math.abs(s.c-t.c)<=1&&Math.abs(s.r-t.r)<=1));target=pick(adj.length?adj:valid);}

  }
 },
 all(){
  simTerrain();
  for(let g=0;g<10;g++){
   if(!run.hand.length||run.t<=30)break;const valid=run.tiles.filter(canPlace);if(!valid.length)break;
   const idx=run.hand.findIndex(id=>!isTerrain(id)&&!(id==='beacon'&&run.tiles.some(t=>t.card==='beacon')));if(idx<0){const di=run.hand.findIndex(id=>!isTerrain(id));if(di<0)break;discardCard(di);continue;}
   const c=CARDS[run.hand[idx]];let target;
   if(c.spawn)target=pick(valid);else{const sps=spawnTiles(false);const adj=valid.filter(t=>sps.some(s=>Math.abs(s.c-t.c)<=1&&Math.abs(s.r-t.r)<=1));target=pick(adj.length?adj:valid);}

 /* v1.0 §17.5 (c)(d): 드롭 즉시·캠프마다 손패를 놓되, 변신·조합이 성립하는 칸을 우선. 소환 타일은 dangerFree+1 까지 */

 /* v1.1 체인 활용: 집중 배치와 같은 틀에 체인 점수(chainScore)를 더한다 — 소환 2~3연속 + 그 옆 지원(순환·보급선) */

 /* v1.2 길가·지형 사용: 체인 활용 배치 + 결계 점수(scoreCell)로 비도로 칸 배치 · 제어 카드 사용 */

};
/* 출격 리더의 동아리(선두 교체·매각과 무관). 라운드 2: party[0] 기준을 출격 리더로 고정 */
const leaderClub=()=>{const s=run&&STUDENTS.find(x=>x.id===run.leaderId);return s?s.club:(run&&run.party[0]?run.party[0].stu.club:null);};
function placeDeck(mode){
 simTerrain();
 for(let g=0;g<10;g++){
  if(!run.hand.length||run.t<=20)break;const valid=run.tiles.filter(canPlace);if(!valid.length)break;
  const sp=spawnTiles(true).length,lead=leaderClub();
  let best=null;
  for(let i=0;i<run.hand.length;i++){const id=run.hand[i],c=CARDS[id];
   if(isTerrain(id))continue;
   if(c.spawn&&sp>=dangerFreeNow()+1)continue;
   if(id==='beacon'&&run.tiles.some(t=>t.card==='beacon'))continue;
   const gs=simFeatures&&meta.goal?goalSpots(meta.goal,[id],run.tiles):null; /* 목표 조합이 성립하는 칸 +4 */
   for(const t of valid){let s=scoreTile(id,t);if(c.sig&&run.party.some(m=>m.stu.id===c.sig))s+=3;if(mode==='focus'&&c.club===lead)s+=1;if(gs&&gs.has(t.i))s+=4;s+=Math.random()*0.3;if(!best||s>best.s)best={s,i,t};}}
  if(!best||best.s<=0){if(run.hand.length>=7){let di=run.hand.length-1;while(di>0&&isTerrain(run.hand[di]))di--;discardCard(di);}break;}
  /* 예비 3장: 변신·주지원 연결·소환 부족(점수 ≥4)이 아니면 손패 3장은 남긴다 (조합 대기) */
  if(best.s<4&&run.hand.length<=3)break;
  placeCard(best.t,best.i);

}
const POLICIES={
 naive(){if(alive().some(m=>m.hp<m.maxHp*0.5)||run.party.some(m=>m.down))buyDrink();for(const kind of ['student','relic','supply'])for(const o of run.shop.offers){if(o.sold||o.kind!==kind||run.op<priceOf(o))continue;if(kind==='student'&&run.party.length>=partyMax()&&!run.party.find(m=>m.stu.id===o.stu.id))continue;buy(o.uid);}},

   if(best){const o=best.o;if(o.kind==='student'&&run.party.length>=partyMax()&&!run.party.find(m=>m.stu.id===o.stu.id)){const wi=run.party.indexOf(run.party.reduce((a,b)=>memberValue(a)<=memberValue(b)?a:b));buy(o.uid,wi);}else buy(o.uid);continue;}
   if((run.op>=rerollCost()+3||(run.party.length<2&&run.op>=10))&&rerolls<2&&run.t>T_IMMINENT){reroll();rerolls++;continue;}

 /* v1.0 (c) 집중: 리더 동아리 학생 우선(강화·변신) (d) 분산: 최고 ★·희귀 우선 */

};
const SIM_BASE={score:'chain',relic:'land',ab_nobuy:'chain',ab_reroll:'chain',ab_demolish:'chain',ab_summon:'all'};
const SIM_START_RELICS={ab_nobuy:['ledger','neardeath'],ab_reroll:['regular'],ab_demolish:['frontmap'],ab_summon:['medal','frontmap']};
/* 대형 보급의 상자: 기본 정책은 남는 OP 로만(학생·★ 뒤), score/relic 은 먼저 */
function simBuyCrates(want){if(!run.shop.crates||run.ended)return;for(let k=0;k<run.shop.crates.length;k++){const cr=run.shop.crates[k];if(cr.sold||!crateRoom(cr))continue;const price=cratePrice(cr.kind,!cr.small);

    put2(r.level === 'error' ? 'fail' : 'pass', r.level === 'error' ? `저장할 수 없는 값 ${r.items.length}개 (음수·빈 값·100% 초과)` : '음수·빈 값·100% 초과 없음', r.items);
    put2(rec.level === 'warn' ? 'warn' : 'pass', rec.level === 'warn' ? `권장 범위 밖 ${rec.items.length}개` : '바뀐 값이 모두 권장 범위 안', rec.items);
    put2(dsc.level === 'warn' ? 'warn' : 'pass', dsc.level === 'warn' ? `설명 문구와 다른 값 ${dsc.items.length}개` : '설명 문구와 수치 일치', dsc.items);
    put2(pool.level==='ok'?'pass':'fail',pool.level==='ok'
      ?'기본 카드 풀 49장 · 게이트 24장 · 결계 풀 구성 정상':`카드 구성 이상 — ${pool.detail}`);
    put2(dk.level === 'ok' ? 'pass' : 'fail', dk.level === 'ok' ? '덱 편성 규칙 통과' : `덱 편성 규칙 어긋남 — ${dk.detail}`);
    put2(en.level === 'ok' ? 'pass' : 'fail', en.level === 'ok' ? '강화한 뒤 값도 상한 안' : `동아리 강화 상한을 넘는 값 ${en.items.length}개`, en.items);
    for (const x of iv) if (x.id.startsWith('rule_') && x.level !== 'ok') put2('warn', `${x.name} — ${x.detail}`);
    for (const id of ['combo', 'file', 'base']) { const x = iv.find(y => y.id === id); if (x && x.level !== 'ok') put2(x.level === 'error' ? 'fail' : 'warn', `${x.name} — ${x.detail}`, x.items); }
    const n = k => out.filter(c => c.level === k).length;
    return { list: out, pass: n('pass'), warn: n('warn'), fail: n('fail'), sum: [`${n('pass')}개 통과`, n('warn') ? `주의 ${n('warn')}개` : '', n('fail') ? `오류 ${n('fail')}개` : ''].filter(Boolean).join(' · ') };
  }
  function canSave() {
    const errs = B.REG.filter(e => statusOf(e).status === 'error').map(e => ({ path: e.path, msg: `${where(e)}: ${statusOf(e).msg}` }));

  }
  /* 상단 상태 — state: error(저장할 수 없음) · unsaved(저장 안 한 변경) · saved(저장됨, 기본값과 다른 값 N) · default(기본값 그대로) */
  function summary() {

  }

  /* ---------- 서버 · 저장 · 내보내기 · 가져오기 ---------- */
  let srvInfo = null;
  async function fetchJson(url, body) {
    let r;
    try { r = await fetch(url, { method: body === undefined ? 'GET' : 'POST', headers: body === undefined ? {} : { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body), cache: 'no-store' }); }

    let o = null; try { o = await r.json(); } catch (e) { o = { ok: false, error: `응답이 JSON 이 아님(${r.status})` }; }
    if (!r.ok && o && o.ok !== false) o.ok = false;
    return o;
  }
  const publicMode = !!window.LG_BALANCE_PUBLIC;
  const NO_SERVER = publicMode ? '외부 편집판 · 변경은 JSON 파일로 저장합니다' :
    'npm run balance 로 열어야 저장·시뮬이 됩니다';
  async function server(refresh) {
    if (srvInfo && !refresh) return srvInfo;
    if (publicMode) return (srvInfo = { ok: false, save: false, sim: false, why: NO_SERVER });
    if (typeof location !== 'undefined' && location.protocol === 'file:') return (srvInfo = { ok: false, save: false, sim: false, why: NO_SERVER });
    const o = await fetchJson('/api/balance/ping');
    srvInfo = o && o.ok && o.json ? { ok: true, save: !!o.save, sim: !!o.sim, why: '' } : { ok: false, save: false, sim: false, why: NO_SERVER };
    return srvInfo;
  }
  function download(text, name) {
    const a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], { type: 'application/json;charset=utf-8' }));
    a.href = url; a.download = name || 'overrides.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  const exportText = (o = {}) => F.formatJson(o.all ? {v:1,values:Object.fromEntries(B.REG.map(e=>[e.path,cur(e.path)])),base:{},history:[]} : o.record ? buildSave(o.memo) : { ...overrides(), history: saved.history });
  function exportFile(o = {}) { download(exportText(o), o.name || 'overrides.json'); return { ok: true, msg: 'overrides.json 를 내려받았습니다 — 저장소의 balance/ 폴더에 넣으면 게임·빌드에 적용됩니다' }; }
  /* 백업(가져오기 전 자동) — 메모리 + 이 브라우저 localStorage(막혀 있으면 메모리만) */
  function makeBackup(why) {
    backupMem = { t: new Date().toISOString(), why: why || '', values: overrides().values };
    try { localStorage.setItem(BACKUP_KEY, JSON.stringify(backupMem)); } catch (e) { /* 저장소 차단 — 메모리 백업만 */ }
    return { t: backupMem.t, at: atText(backupMem.t), n: Object.keys(backupMem.values).length, why: backupMem.why };
  }
  function readBackup() { if (backupMem) return backupMem; try { return JSON.parse(localStorage.getItem(BACKUP_KEY) || 'null'); } catch (e) { return null; } }
  function backupInfo() { const b = readBackup(); return b && b.values ? { t: b.t, at: atText(b.t), n: Object.keys(b.values).length, why: b.why || '' } : null; }
  function restoreBackup() {
    const b = readBackup(); if (!b || !b.values) return { ok: false, msg: '백업이 없습니다' };
    const items = applyBatch('백업 되살리기', B.REG.map(e => [e.path, has(b.values, e.path) && !B.badValue(e, b.values[e.path]) ? b.values[e.path] : e.def]));
    return { ok: true, n: items.length, msg: `백업(${atText(b.t)})으로 되돌렸습니다 — 저장 전` };
  }
  function importText(text) {
    const r = F.parse(String(text || ''));
    if (!r.ok) return { ok: false, msg: '가져오기 실패: ' + r.error, skipped: [] };
    const backup = makeBackup('가져오기 전');
    const vals = r.data.values, skipped = [];
    for (const p of Object.keys(vals)) { const e = B.byPath(p), why = !e ? '모르는 항목' : B.badValue(e, vals[p]) ? '범위 밖 값' : ''; if (why) skipped.push({ path: p, where: e ? where(e) : p, value: vals[p], why }); }
    const ok = p => has(vals, p) && !skipped.some(s => s.path === p);
    const items = applyBatch('가져오기', B.REG.map(e => [e.path, ok(e.path) ? vals[e.path] : e.def]));
    const n = Object.keys(vals).length - skipped.length;
    return { ok: true, applied: n, changed: items.length, skipped, backup, msg: `가져왔습니다 — ${n}개 적용${skipped.length ? ` · ${skipped.length}줄 건너뜀` : ''} (저장 전 · 가져오기 전 값은 백업)` };
  }
  async function save(o = {}) {
    const cs = canSave();
    if (!cs.ok) return { ok: false, mode: null, msg: `저장할 수 없습니다 — ${cs.errors[0].msg}`, errors: cs.errors };
    const changes = pendingChanges(), data = buildSave(o.memo), srv = await server();
    if (!srv.save) { download(F.formatJson(data)); return { ok: true, mode: 'export', changes, msg: `${NO_SERVER} — 대신 overrides.json 를 내려받았습니다(balance/ 폴더에 넣기)` }; }
    const r = await fetchJson('/api/balance/save', data);
    if (!r || !r.ok) return { ok: false, mode: 'server', msg: '저장 실패: ' + ((r && r.error) || '응답 없음'), errors: (r && r.errors) || [] };
    saved.values = { ...data.values }; saved.base = { ...data.base }; saved.history = data.history.slice(); loadSkipped.length = 0;
    emit('save', { n: r.n, changes }); emit('change', { label: '저장', items: [] });
    return { ok: true, mode: 'server', changes, msg: '저장했습니다 · 게임을 새로 고치면 적용됩니다' };
  }
  /* 마지막 저장 되돌리기: 이력 맨 위 항목의 「이전」 값으로 되돌려 다시 저장(이력에는 「되돌림」 한 줄이 새로 남는다) */
  async function undoLastSave() {
    const last = saved.history[0];
    if (!last) return { ok: false, msg: '되돌릴 저장이 없습니다' };
    if (pendingChanges().length) return { ok: false, msg: '저장 안 한 변경이 있습니다 — 먼저 저장하거나 되돌린 뒤' };
    const vals = { ...saved.values };
    for (const it of last.items || []) { const e = B.byPath(it.p); if (!e) continue; if (it.from == null || same(it.from, e.def) || B.badValue(e, it.from)) delete vals[it.p]; else vals[it.p] = it.from; }
    applyBatch('마지막 저장 되돌림', B.REG.map(e => [e.path, has(vals, e.path) ? vals[e.path] : e.def]));
    const r = await save({ memo: `되돌림: ${last.memo || atText(last.t)}` });
    return r.ok && r.mode === 'server' ? { ...r, msg: '마지막 저장을 되돌렸습니다' } : r;
  }

  /* ---------- 빠른 시뮬(서버의 node 하네스 · 한 번에 하나) ----------
   * 결과 표(시안): 지표 · 기본값 · 바꾼 뒤 · 차이 — E 게이트 승률 · C 게이트 승률 · 이 타일 배치율 · 런 끝 남은 OP · 평균 런 길이.
   * 결과에는 그때 쓴 값(snapshot)이 들어 있어 isStale(result) 로 「이전 값 기준」 표시를 한다 */
  const SIM_COLUMNS = [{ key: 'label', label: '지표' }, { key: 'base', label: '기본값' }, { key: 'cand', label: '바꾼 뒤' }, { key: 'diff', label: '차이' }];
  function simDefaults(groupId) {
    const g = grp(groupId), card = g && g.card ? g.card : null, c = card ? CARDS[card] : null, gates = ['E', 'C'];
    if (c && c.gate && !gates.includes(c.gate)) gates.push(c.gate);
    return { group: groupId || null, gates, leaders: [0, 1, 2], reps: 10, policy: c && (c.cls === 'side' || c.cls === 'land') ? 'land' : 'chain', card, force: !!(card && isDeckable(card)), base: 'default', seed: 1 };
  }
  const sortedJson = o => JSON.stringify(Object.keys(o || {}).sort().map(k => [k, o[k]]));
  const sim = {
    columns: SIM_COLUMNS,
    defaults: simDefaults,
    /* 예상 시간(초): 런 하나 약 0.25초(낮은 우선순위 node 1개 기준) */
    estimate: o => { const d = { ...simDefaults(o && o.group), ...(o || {}) }; return Math.max(10, Math.round((d.gates.length * 2 * d.leaders.length * d.reps * 0.25) / 10) * 10); },
    canRun() { const s = summary(); return s.changed > 0 && !s.errors; },
    async start(o = {}) {
      const srv = await server(); if (!srv.sim) return { ok: false, msg: '빠른 시뮬은 ' + NO_SERVER.replace('저장·시뮬이 됩니다', '열었을 때만 됩니다') };
      const cs = canSave(); if (!cs.ok) return { ok: false, msg: '빨간 항목을 고치면 돌릴 수 있습니다.' };
      const d = { ...simDefaults(o.group), ...o }, base = d.base === 'saved' ? { ...saved.values } : {};
      const r = await fetchJson('/api/balance/sim', { cand: overrides().values, base, baseKind: Object.keys(base).length ? 'saved' : 'default', gates: d.gates, leaders: d.leaders, reps: d.reps, policy: d.policy, card: d.card, force: d.force, seed: d.seed });
      if (!r || !r.ok) return { ok: false, msg: '빠른 시뮬 시작 실패: ' + ((r && r.error) || '응답 없음') + (r && r.errors ? ' — ' + r.errors.map(x => x.msg || x).slice(0, 3).join(' · ') : '') };

    },
    /* {state: idle|running|done|error|cancelled, done, total, cur:{gate, side, k, n}, plan:[{gate, side, n}], elapsedMs, etaMs, result, error} */
    async status() { const r = await fetchJson('/api/balance/sim'); return r && r.ok ? r : { state: 'error', error: (r && r.error) || '응답 없음' }; },
    async cancel() { const r = await fetchJson('/api/balance/sim/cancel', {}); emit('sim', { state: 'cancelled' }); return r; },
    /* 진행 글(시안): 「E 게이트 기본값 12/30런 · 약 20초 남음」 */
    progressText(st) {
      if (!st || st.state !== 'running') return '';
      const c = st.cur || {}, eta = st.etaMs == null ? '' : ` · 약 ${Math.max(1, Math.round(st.etaMs / 1000))}초 남음`;
      return c.gate ? `${c.gate} 게이트 ${c.side === 'base' ? '기본값' : '바꾼 뒤'} ${c.k}/${c.n}런${eta}` : `준비 중${eta}`;
    },
    progressPct: st => (st && st.total ? +((100 * (st.done || 0)) / st.total).toFixed(1) : 0),
    /* 결과 → 시안 표 줄 [{key, label, base, cand, diff, baseText, candText, diffText, big(승률 5%p 초과), noise}] + 판정.
     * 승패·랩·OP·HP 가 모두 같으면 판정 줄에 이유를 적는다: 한 번도 안 놓임 / 발동 안 함(배치 조건) / 발동했지만 차이 없음(회복이면 버려진 몫) / v1.5 스위치 꺼짐 */
    table(result) {
      if (!result || !result.metrics) return { rows: [], verdict: '', verdictLevel: 'ok', noise: null, noiseText: '' };
      const f = (v, u) => (v == null ? '—' : `${v}${u === 'HP' ? ' HP' : u || ''}`), sg = (v, u) => (v == null ? '—' : `${v > 0 ? '+' : v < 0 ? '−' : '±'}${Math.abs(v)}${u === '%' ? '%p' : u === 'HP' ? ' HP' : u || ''}`);
      const rows = result.metrics.map(m => ({ ...m, baseText: f(m.base, m.unit), candText: f(m.cand, m.unit), diffText: sg(m.diff, m.unit), big: m.unit === '%' && m.key.startsWith('win_') && Math.abs(m.diff || 0) > 5 }));
      const maxWin = Math.max(0, ...rows.filter(r => r.key.startsWith('win_')).map(r => Math.abs(r.diff || 0))), noise = Math.max(0, ...rows.filter(r => r.noise != null).map(r => r.noise));
      const same = rows.filter(r => r.key !== 'fires' && r.key !== 'amount').every(r => r.diff == null || r.diff === 0);
      const fx = result.fx || {}, c = result.card ? CARDS[result.card] : null, place = rows.find(r => r.key === 'place');
      const ch = Object.keys((result.snapshot && result.snapshot.cand) || {}), v15Only = ch.length > 0 && ch.every(pth => (B.byPath(pth) || {}).v15) && !BAL.board15;
      let verdict, level;
      if (!same) { level = maxWin > 5 ? 'bad' : 'ok'; verdict = maxWin > 5 ? '승률이 5%p 넘게 바뀌었습니다. 다른 게이트도 확인하세요.' : '승률 변화가 ±5%p 안입니다.'; }
      else if (v15Only) { level = 'info'; verdict = 'v1.5 스위치(BAL.board15)가 꺼져 있어 바꾼 v1.5 값이 게임·시뮬에 반영되지 않았습니다.'; }
      else if (fx.kind && fx.base && fx.cand) {
        level = 'info';
        const fires = Math.max(fx.base.fires || 0, fx.cand.fires || 0);
        if (!fires && place && !(place.base || place.cand)) verdict = '이 타일이 한 번도 놓이지 않아 효과가 발동하지 않았습니다 — 덱·드롭·배치 조건을 확인하세요.';
        else if (!fires) verdict = '효과가 한 번도 발동하지 않았습니다 — 배치 조건을 확인하세요' + (c && c.sup ? '(연결 교전 효과는 소환 타일 옆에 놓아 그 소환 타일의 주지원이 돼야 발동합니다).' : '.');
        else {
          verdict = `효과가 런당 ${+(fx.cand.fires || 0).toFixed(1)}번 발동했지만 승패·랩에는 차이가 없었습니다`;
          if (fx.kind === 'heal' && fx.cand.want > 0) { const waste = Math.round(100 * (1 - (fx.cand.heal || 0) / fx.cand.want)); verdict += waste >= 20 ? ` — 회복 요청의 ${waste}%가 이미 찬 HP에 버려졌습니다.` : '.'; }
          else verdict += '.';
        }
      } else { level = 'info'; verdict = '승패·랩·OP·HP 모두 차이가 없었습니다 — 바꾼 값이 이 런들에서 거의 쓰이지 않았을 수 있습니다.'; }
      return { rows, verdict, verdictLevel: level, same, noise, noiseText: `게이트당 ${result.runsPerGate}런 — ±${noise}%p 안쪽은 우연일 수 있습니다` };
    },
    saveLine(result) { if (!result || !result.metrics) return ''; const t = sim.table(result).rows.filter(r => r.key.startsWith('win_')); return '빠른 시뮬: ' + t.map(r => `${r.key.slice(4)} 승률 ${r.diffText}`).join(', '); },
    baseLabel: result => (result && result.baseKind === 'saved' ? '저장값' : '기본값'),
    /* 메타 가정 한 줄(「E = 첫 출격 메타 · C = C 첫 도전 메타(…)」) — 결과가 있으면 그 결과의 가정, 없으면 기본 게이트(sim-meta.js) */
    metaLine: (result, gates) => (result && result.metaLine) || (window.LGSimMeta ? window.LGSimMeta.noteLine(gates || ['E', 'C']) : ''),
    /* 결과를 낸 값과 지금 값이 다르면 stale — 화면은 「이전 값 기준」으로 표시 */
    isStale(result) {
      if (!result || !result.snapshot) return { stale: false, cand: false, base: false };
      const c = sortedJson(overrides().values) !== sortedJson(result.snapshot.cand), b = result.baseKind === 'saved' && sortedJson(saved.values) !== sortedJson(result.snapshot.base);
      return { stale: c || b, cand: c, base: b };
    },
    /* 진행률을 ms 마다 읽어 cb(상태) — 끝나면(done·error·cancelled·idle) 멈춘다. 멈추는 함수를 돌려준다 */
    watch(cb, ms) {
      let stop = false;
      const tick = async () => { if (stop) return; const s = await sim.status(); try { cb(s); } catch (e) { console.error(e); } if (s.state === 'running' && !stop) setTimeout(tick, ms || 500); else emit('sim', s); };
      tick(); return () => { stop = true; };
    },
  };

  window.BalanceCore = {
    VERSION: 3, CATS: B.CATS, NO_SERVER, publicMode,
    cats, groups, group, entries, sections, entry, search, cardHead,
    set, parseInput, reset, resetGroup, resetAll, revertToSaved, undo, canUndo, undoLabel,
    diff, pendingChanges, changedLines, overrides, history,
    preview, effectLines, descMismatches, invariants, checks, canSave, summary,
    server, save, undoLastSave, exportText, exportFile, importText, backupInfo, restoreBackup,
    sim, on, fmt: (path, v) => { const e = B.byPath(path); return e ? fmt(e, v) : String(v); },
  };
})();

<script>
(function(){
 'use strict';
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',

 const round=n=>+Number(n).toFixed(3),stats=s=>`${s.hp} / ${s.atk} / ${s.def}`;
 function rows(options={}){
  const o={...state,...options},base=GATES.find(g=>g.id===o.region)||GATES[0];
  const risk=CAMPAIGN_RISKS[o.risk]||CAMPAIGN_RISKS.normal,b=ENEMIES[o.type];
  const g={...base,hp:base.hp*risk.hp,atk:base.atk*risk.atk};
  const danger=1+BAL.dangerPer*Math.max(0,o.spawns-BAL.dangerFree);
  const tile=CARDS[o.card]?.risk||{},tier=BAL.upgDanger[o.level-1]||1;
  const mod={hp:tier*(tile.hp||1),atk:tier*(tile.atk||1)};
  return [1,3,5,10].map(lap=>{
   const naked=enemyGrowthStats(o.type,{lap,gateData:{...g,hp:1,atk:1}});
   const quote=enemyGrowthStats(o.type,{lap,gateData:g,danger});
   let final={hp:quote.hp,atk:quote.atk,def:quote.def};
   const boss=b.boss?bossGrowthMultipliers(o.party,o.evos):null;
   if(boss)final={hp:Math.round(final.hp*boss.hp),atk:Math.round(final.atk*boss.atk),def:final.def};
   else final={hp:Math.round(final.hp*mod.hp),atk:Math.round(final.atk*mod.atk),def:final.def};
   return {lap,base:{hp:b.hp,atk:b.atk,def:b.def},loop:{hp:naked.hp,atk:naked.atk,def:naked.def},
    final,growth:quote.growth,boss,tile:b.boss?{hp:1,atk:1}:mod,region:o.region,risk:o.risk,type:o.type};
  });
 }
 function control(key,label,choices){
  const options=choices.map(([id,name])=>`<option value="${esc(id)}"`+
   `${String(state[key])===String(id)?' selected':''}>${esc(name)}</option>`).join('');
  return `<label>${label} <select data-growth="${key}">${options}</select></label>`;
 }
 function number(key,label,max){
  return `<label>${label} <input type="number" data-growth="${key}" min="0" max="${max}"`+
   ` value="${state[key]}" step="1" style="width:5em"></label>`;
 }
 function html(){
  const data=rows(),b=ENEMIES[state.type],first=data[0].final;
  const options=control('type','이형',Object.entries(ENEMIES).map(([id,e])=>[id,e.name]))+
   control('region','지역',GATES.map(g=>[g.id,g.id]))+
   control('risk','원정 난도',[['normal','일반'],['danger','위험']])+
   number('spawns','소환 타일 수',30)+control('level','타일 승급',[[1,'Lv1'],[2,'Lv2'],[3,'Lv3']])+
   control('card','위험 타일',[['','없음'],...Object.entries(CARDS).filter(([,c])=>c.spawn&&c.risk)
    .map(([id,c])=>[id,c.name])])+number('evos','보스 진화 수',20)+number('party','분대 인원',6);
  const table=data.map(r=>`<tr><th>${r.lap}랩</th><td>${esc(stats(r.loop))}</td>`+
   `<td>HP ×${round(r.growth.hpGate)} / 공격 ×${round(r.growth.atkGate)}</td>`+
   `<td>${esc(stats(r.final))}</td><td>HP ×${round(r.final.hp/first.hp)} / `+
   `공격 ×${round(r.final.atk/first.atk)}</td></tr>`).join('');
  const edit=`<button type="button" data-ov-detail="g_enemy_growth">공통·보스 성장 편집 ↗</button>`+
   `<button type="button" data-ov-detail="gate_${state.region}">지역 ${state.region} 계수 편집 ↗</button>`;
  return `<section class="ov-growth" aria-label="이형 루프 성장 비교" style="margin:1rem 0">`+
   `<h2>루프 성장 비교 · 숫자를 바꾸면 즉시 반영</h2><p>기본 HP / 공격 / 방어: ${esc(stats(data[0].base))}. `+
   `1랩은 성장 0회입니다. 지역 HP 계수 h가 공통 대체값보다 우선합니다.</p>`+
   `<div class="ov-toolbar">${options}</div><p class="ov-growth-scroll">`+
   `표를 가로로 밀면 지역 배율과 최종 수치를 볼 수 있습니다.</p>`+
   `<div class="ov-table-wrap" tabindex="0" aria-label="성장 비교 표 가로 스크롤"><table class="ov-table">`+
   `<thead><tr><th>랩</th><th>기본 + 랩 성장<br>HP / 공격 / 방어</th>`+
   `<th>지역·난도 배율</th><th>최종 생성 수치<br>HP / 공격 / 방어</th>`+
   `<th>1랩 대비</th></tr></thead><tbody>${table}</tbody></table></div>`+
   `<p>${b.boss?'보스는 과밀·타일 승급·위험 타일의 영향을 받지 않습니다. '+
    '인원/고정 HP 배율과 진화 수를 포함하며 A 쌍둥이 분열·격노 전 공통 보스 기준입니다.'
    :'최종 수치는 지역·난도·소환 과밀·타일 승급·위험 타일을 포함합니다. '+
    '먼지·체인·정예·개별 진화·주변 시설의 전투 중 공격 변화는 별도입니다.'}</p>`+
   `<p>지역 배율은 ${round(BAL.enemyGrowth.gateRampLaps+1)}랩부터 전부 적용. `+
   `일반 HP 성장: 지역 h × ${BAL.lapHpMul}. 과밀은 ${BAL.dangerFree}개 초과당 `+
   `${round(BAL.dangerPer*100)}%. ${edit}</p></section>`;
 }
 document.addEventListener('change',event=>{
  const key=event.target.dataset?.growth;if(!key)return;
  const numeric=['spawns','level','evos','party'].includes(key),value=event.target.value;
  state[key]=numeric?Math.max(key==='party'?1:0,Math.min(key==='spawns'?30:key==='evos'?20:6,
   Math.floor(Number(value)||0))):value;
  window.BalanceOverview?.render();
 });
 window.BalanceEnemyGrowth={rows,html,state};
})();

</script>
<script>
(function () {
  'use strict';
  const B=window.LG_BALANCE,C=window.BalanceCore;
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const state={tab:'cards',q:'',filter:'',changed:false,heroTable:true,open:new Set()};
  const tabs=[['cards','전체 카드'],['heroes','영웅'],['relics','유물'],['enemies','적 · 게이트'],['economy','경제 · 성장'],['combat','점수 · 전투']];
  const economyGroups=new Set(['g_reward','g_upg','g_gate','g_ctl','g_service','g_crates','g_econ_op','g_econ_price','g_econ_res','g_relationship','g_affection']);
  function fields(id,extra=[]){const entries=[...new Set([...(B.group(id)?.paths||[]),...extra])].map(p=>C.entry(p)).filter(Boolean);return id.startsWith('hero_')?entries.sort((a,b)=>Number(b.path.startsWith('STUDENTS.'))-Number(a.path.startsWith('STUDENTS.'))):entries;}
  function records(){
    const out=[];
    for(const [id,c] of Object.entries(CARDS)){
      const category=c.tile?(id.endsWith('_side')?'보드 확장 변형':'조합 · 변신 결과'):c.type==='control'?'전술 내부 정의':!isPlayable(id)?'시스템 타일':c.field?'보드 지원 시설':c.cls==='land'?'보드 지형':c.cls==='side'?'길가':c.gate?'게이트 전용':c.spawn?'도로 소환':'도로 지원';
      const zone={road:'도로 위',side:'도로 옆 칸',land:'비도로 칸',control:'전술 대상'}[cardClass(id)]||'특수';
      out.push({id,tab:'cards',name:c.name,icon:c.icon||'◇',color:c.bd,category,subtitle:zone+' · '+(isDeckable(id)?'해금 후 덱 편성':isPlayable(id)?'팩 획득':'직접 편성 불가'),desc:c.desc,entries:fields(id),note:(id.endsWith('_side')&&!BAL.board15?'보드 확장 OFF · 현재 미사용. ':'')+(c.contract?'계약 OP는 기초값입니다. 재화 환산·감쇠·분대 보정은 별도로 적용됩니다. ':''),related:COMBOS.filter(x=>x.to===id).map(x=>x.name||CARDS[x.to]?.name).join(' · ')});
    }
    for(const s of STUDENTS)out.push({id:'hero_'+s.id,tab:'heroes',name:s.name,icon:s.ex.icon,category:ROLES[s.role],subtitle:CLUBS[s.club]+' · '+RARITY[s.rarity].name+' · '+s.weapon,desc:s.trait.name+' — '+s.trait.desc,second:s.ex.name+' — '+s.ex.desc,entries:fields('hero_'+s.id,[...(s.id==='seoyul'?['BAL.medic']:[]),...(['harin','chaewon','somi','bora','gaeul'].includes(s.id)?['BAL.exDuration']:[])]),note:'기본 능력치 기준. 장비·성장·시너지·진형은 별도. 도발은 진형 v2에서 전열만 적용.'});
    for(const r of RELICS)out.push({id:'relic_'+r.id,tab:'relics',name:r.name,icon:r.icon,category:r.cond?'조건부':'상시 · 캠프',subtitle:(RARITY[r.rarity]?.name||'희귀도 범위 오류')+' · '+({score:'점수 배율',scoreAdd:'점수 가산',atk:'공격',atkPct:'공격',xp:'경험치',heal:'회복',drop:'카드 공급',crit:'치명타'}[r.target]||'원정 효과'),desc:r.desc,entries:fields('relic_'+r.id,r.id==='medkit'?['BAL.econ.heal.medkit']:[]),note:['contract','specimen'].includes(r.id)&&BAL.econ2?'재화 개편 ON: 현재 원정 효과에 미적용':r.target==='score'?`점수 유물 합산 배율 상한 ×${BAL.score.relicMax}도 함께 확인하세요.`:''});
    for(const [id,e] of Object.entries(ENEMIES))out.push({id:'enemy_'+id,tab:'enemies',name:e.name,icon:'⚔',category:'이형',subtitle:'게이트·루프 보정 전',desc:'기본 성능과 처치 보상. 타일 계약 보상은 카드에서 별도 편집합니다.',entries:fields('enemy_'+id)});
    for(const g of GATES)out.push({id:'gate_'+g.id,tab:'enemies',name:g.id+' · '+g.name,icon:'⛩',category:'게이트',subtitle:g.boss,desc:g.mechDesc,entries:fields('gate_'+g.id)});
    for(const g of B.GROUPS){
      if(g.card||/^(hero_|relic_|enemy_|gate_)/.test(g.id))continue;
      const skill=g.id.startsWith('skill_'),facility=g.id.startsWith('facility_'),eco=economyGroups.has(g.id)||skill||facility;
      if(g.id==='g_enemy_growth'){
        out.push({id:g.id,tab:'enemies',name:g.name,icon:g.icon,category:'루프 성장',
          subtitle:g.scope,desc:g.hint,entries:fields(g.id)});continue;
      }
      out.push({id:g.id,tab:eco?'economy':'combat',name:g.name,icon:g.icon,category:skill?'영구 스킬':facility?'사무소 시설':g.id==='g_relationship'?'인연 성장':g.id==='g_score'?'점수 · 목표':eco?'경제 · 공급':'전투 · 배치',subtitle:g.scope,desc:g.hint,entries:fields(g.id),note:skill?'본문은 원본 스킬 설명입니다. 수정 후에는 아래 효과 수치를 기준으로 보세요.':g.v15&&!BAL.board15?'보드 확장 OFF · 현재 미사용':''});
    }
    for(const record of out)if(record.tab==='cards'&&window.GL?.cardDesc)
      record.desc=GL.cardDesc(record.id);
    return out;
  }
  function input(e){
    const attrs=`data-p="${esc(e.path)}" aria-label="${esc(e.where)}" aria-invalid="${e.status==='error'}" title="${esc(e.desc+' · 허용 '+e.rangeText)}"`;
    return e.unit==='enum'?`<select ${attrs}>${e.opts.map((o,i)=>`<option value="${esc(o)}"${e.value===o?' selected':''}>${esc(e.labels?.[i]??o)}</option>`).join('')}</select>`:`<input type="number" ${attrs} value="${esc(e.input)}" step="${e.inputStep}">`;
  }
  function field(e){return `<div class="ov-field ${e.changed?'changed':''} ${e.status}"><label>${esc(e.name)}<span class="ov-value">${input(e)}<span>${esc(e.unitTxt)}</span><button type="button" data-reset="${esc(e.path)}" aria-label="${esc(e.where)} 기본값 복원" title="기본값 복원"${e.changed?'':' disabled'}>↶</button></span></label><small>기본 ${esc(e.defText)}${e.changed?' → '+esc(e.text):''}</small>${e.status==='error'?`<strong role="alert">${esc(e.msg)}</strong>`:''}<small class="ov-help">${esc(e.desc)}${e.tag?' · '+esc(e.tag):''}</small></div>`;}
  function card(r){
    const n=r.tab==='heroes'?5:r.tab==='cards'?3:4,quick=r.entries.slice(0,n),rest=r.entries.slice(n),changed=r.entries.filter(e=>e.changed).length;
    return `<article class="ov-card" data-record="${esc(r.id)}" style="--accent:${esc(r.color||'#4a7ea5')}"><div class="ov-kicker">${esc(r.category)}${changed?` <b>변경 ${changed}</b>`:''}</div><h2><span>${esc(r.icon||'⚙')}</span> ${esc(r.name)}</h2><p class="ov-sub">${esc(r.subtitle||'')}</p><p class="ov-desc">${esc(r.desc||'고정 규칙')}</p>${r.second?`<p class="ov-ex">EX · ${esc(r.second)}</p>`:''}${r.note?`<p class="ov-note">${esc(r.note)}</p>`:''}<div class="ov-fields">${quick.map(field).join('')}</div>${rest.length?`<details data-detail="${esc(r.id)}"${state.open.has(r.id)?' open':''}><summary>나머지 수치 ${rest.length}개 펼치기</summary><div class="ov-fields">${rest.map(field).join('')}</div></details>`:''}<footer><span>${r.entries.length?'편집 '+r.entries.length+'항목':'직접 조정하는 수치 없음 · 고정 규칙'}</span>${r.entries.length?`<button type="button" data-ov-detail="${esc(r.id)}">상세 편집 ↗</button>`:''}</footer>${r.tab==='cards'&&r.entries.some(e=>e.changed)?'<p class="ov-note">효과 설명은 현재 입력값을 반영합니다. 조합 조건과 실제 적용 범위는 상세 편집에서 확인하세요.</p>':''}</article>`;
  }
  function heroTable(rows){return `<div class="ov-table-wrap"><table class="ov-table"><thead><tr><th>영웅 · 역할</th><th>HP</th><th>공격</th><th>방어</th><th>공격속도</th><th>치명타 %</th><th>특성 · EX</th></tr></thead><tbody>${rows.map(r=>`<tr><th><b>${esc(r.icon)} ${esc(r.name)}</b><small>${esc(r.category+' · '+r.subtitle)}</small><button type="button" data-ov-detail="${r.id}">특성 · EX 수치 편집 ↗</button></th>${r.entries.slice(0,5).map(e=>`<td class="${e.changed?'changed':''}">${input(e)}<small>기본 ${esc(e.defText)}</small>${e.status==='error'?`<strong role="alert">${esc(e.msg)}</strong>`:''}</td>`).join('')}<td class="ov-table-desc">${esc(r.desc)}<p>${esc(r.second)}</p></td></tr>`).join('')}</tbody></table></div>`;}
  function renderRows(){
    const all=records(),rows=all.filter(r=>r.tab===state.tab),q=state.q.trim().toLowerCase(),shown=rows.filter(r=>(!state.filter||r.category===state.filter)&&(!state.changed||r.entries.some(e=>e.changed))&&(!q||[r.name,r.id,r.subtitle,r.desc,r.second,...r.entries.map(e=>e.name+' '+e.desc)].join(' ').toLowerCase().includes(q)));

  }
  function render(){

    host.innerHTML=`<div class="ov-intro"><div><h1>게임 밸런스 전체 보기</h1><p>비교 → 숫자 수정 → <b>현재 수치로 테스트</b> → 재수정 → JSON 전달. 모든 편집은 같은 저장 파일과 되돌리기를 사용합니다.</p></div><button type="button" id="bExportAll">전체 수치 내려받기</button></div><div class="ov-stats"><span>카드 <b>${Object.keys(CARDS).length}</b> 정의 / 획득·배치 <b>${Object.keys(CARDS).filter(isPlayable).length}</b></span><span>영웅 <b>${STUDENTS.length}</b>명</span><span>유물 <b>${RELICS.length}</b>종</span><span>편집 가능 <b>${B.REG.length}</b>수치</span></div><nav class="ov-tabs" aria-label="밸런스 대상">${tabs.map(([id,label])=>`<button type="button" data-ov-tab="${id}" aria-pressed="${id===state.tab}">${label} <span>${all.filter(r=>r.tab===id).length}</span></button>`).join('')}</nav><div class="ov-toolbar"><input id="ovSearch" type="search" aria-label="전체 목록 검색" placeholder="이름 · 효과 · 조정 항목 검색" value="${esc(state.q)}"><select id="ovFilter" aria-label="세부 분류"><option value="">모든 분류</option>${cats.map(c=>`<option${state.filter===c?' selected':''}>${esc(c)}</option>`).join('')}</select><label><input id="ovChanged" type="checkbox"${state.changed?' checked':''}> 기본값과 다른 항목만</label><span id="ovCount" role="status"></span></div><p class="ov-guide">${state.tab==='cards'?'도로 소환 / 도로 지원 / 길가 / 보드 지형을 구분합니다. 변신·시스템 정의도 포함하며, 등장 가중치는 확률이 아닌 상대 비중입니다.':state.tab==='heroes'?'HP·공격·방어·공격속도·치명타를 먼저 비교하고, 펼치면 특성과 EX 계수를 수정할 수 있습니다.':state.tab==='relics'?'희귀도와 효과를 바로 수정합니다. 조건부 점수 유물은 점수 · 전투의 전체 배율 상한과 함께 조정하세요.':'가격·보상·제한·배율의 적용 조건을 확인하고 조정하세요. 기존 재화와 재화 개편 수치는 각각의 규칙에만 적용됩니다.'}</p><div id="ovGrid" class="ov-grid"></div>${state.tab==='cards'?`<details class="ov-tactics"><summary>별도 전술 ${TACTICS.length}종 · 고정 효과 보기</summary>${TACTICS.map(t=>`<p><b>${esc(t.icon)} ${esc(t.name)}</b> — ${esc(t.desc)}</p>`).join('')}<p>전술 슬롯·상자 가격은 경제 · 성장에서 편집합니다.</p></details>`:''}`;

    if(state.tab==='enemies'&&window.BalanceEnemyGrowth)
      host.querySelector('.ov-guide').insertAdjacentHTML('afterend',window.BalanceEnemyGrowth.html());
    renderRows();host.scrollTop=scroll;
    if(focus){const el=[...host.querySelectorAll('[data-p]')].find(e=>e.dataset.p===focus);if(el)el.focus({preventScroll:true});}
  }
  document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.ovView){state.heroTable=!state.heroTable;render();}if(b.dataset.ovTab){state.tab=b.dataset.ovTab;state.filter='';state.q='';render();document.querySelector('#balanceOverview').scrollTop=0;}if(b.dataset.ovDetail)window.BalanceUI.select(b.dataset.ovDetail);});
  document.addEventListener('input',ev=>{if(ev.target.id==='ovSearch'){state.q=ev.target.value;renderRows();}});
  document.addEventListener('change',ev=>{if(ev.target.id==='ovFilter'){state.filter=ev.target.value;renderRows();}if(ev.target.id==='ovChanged'){state.changed=ev.target.checked;renderRows();}});
  document.addEventListener('toggle',ev=>{if(ev.target.dataset?.detail){if(ev.target.open)state.open.add(ev.target.dataset.detail);else state.open.delete(ev.target.dataset.detail);}},true);
  window.BalanceOverview={render,records};
})();

      : `<input type="range" data-p="${e.path}" aria-label="${esc(e.name)} 슬라이더" min="${e.sliderMin}" max="${e.sliderMax}" step="${e.inputStep}" value="${e.sliderValue}"><div class="band" aria-hidden="true"><i style="left:${e.bandL}%;width:${e.bandW}%"></i><b style="left:${e.defL}%"></b></div><div class="scale"><span>${esc(e.sminText)}</span><span class="rec">권장 ${esc(e.recText)}</span><span>${esc(e.smaxText)}</span></div>`;

  /* 슬라이더를 끄는 동안에는 행을 다시 그리지 않고 그 행만 고친다(끌기가 끊기지 않게) */
  function patchRow(path) {

  /* ---------- 오른쪽 ---------- */
  function simHtml() {

  }
  function checksHtml() {
    const ck = C.checks(), ic = { pass: I.pass, warn: I.cWarn, fail: I.cFail };
    return `<div class="checks"><div class="simhd"><h2>규칙 검사</h2><span class="hint13">${esc(ck.sum)}</span></div><ul>`
      + ck.list.map(c => `<li class="${c.level}"${c.items.length ? ` title="${esc(c.items.slice(0, 12).join('\n'))}"` : ''}>${ic[c.level]}<span>${esc(c.text)}</span></li>`).join('') + '</ul></div>';
  }
  function renderRight() {
    const r = $('#right');
    if (S.tab === 'history') {
      const li = S.lastImport, bk = C.backupInfo(), off = C.summary().changed === 0;
      r.innerHTML = '<div class="files"><h2 style="margin:0;font-size:14px;font-weight:700;color:#0d6fd0">파일</h2>'
        + '<p style="font-size:14px;color:#33405c">수정본을 JSON으로 내려받아 보관하거나 전달하세요. 가져오기로 계속 편집할 수 있습니다. 현재 수치로 테스트에서 즉시 플레이할 수 있습니다. 공개 게임에는 별도 배포 후 적용됩니다.</p>'
        + '<button type="button" class="bbtn" id="bExport">내보내기 (파일로 저장)</button><button type="button" class="bbtn" id="bExportAll">전체 수치 JSON</button><button type="button" class="bbtn" id="bImport">가져오기 (파일 열기)</button><a class="bbtn" href="../characters-b/" target="_blank" rel="noopener">공개 게임 열기 (배포 수치)</a>'
        + `<button type="button" class="bbtn danger" id="bResetAll2"${off ? ' disabled' : ''}>모두 기본값으로</button>`
        + '<p class="hint13">가져오기 전에 지금 값을 자동으로 백업합니다. 가져온 파일에 모르는 항목이나 범위를 벗어난 값이 있으면 그 줄만 건너뛰고 알려 줍니다.</p>'
        + (li && li.skipped.length ? `<p class="hint13" style="color:#7a5200">건너뛴 줄 ${li.skipped.length}개</p><ul class="skl">${li.skipped.slice(0, 8).map(x => `<li>${esc(x.where)} — ${esc(x.why)}</li>`).join('')}</ul>` : '')
        + (bk ? `<button type="button" class="bbtn" id="bRestore">가져오기 전 백업으로 (${esc(bk.at)})</button>` : '') + '</div>';
      return;
    }
    let top = '';
    if (S.tab === 'tile') {
      const p = S.sel ? C.preview(S.sel) : null, h = S.sel ? C.cardHead(S.sel) : null;
      top = '<div class="rblock"><h2>효과 미리보기</h2>';
      if (p && h) {
        const ch = p.changes, all = p.lines.map(l => `${l.label}: ${l.text}`).join('\n');
        top += `<div class="pvrow"><div class="minicard" aria-hidden="true" title="${esc(all)}" style="border-color:${h.bd}"><div class="top" style="background:${h.bg}"><span>${esc(h.catShort)}</span></div><div class="bd"><b>${esc(h.name)}</b><span>${esc(p.face)}</span></div></div><div class="chl">`
          + ch.slice(0, 3).map(l => `<div style="display:flex;flex-direction:column"><span class="lb">${esc(l.label)}</span><span class="vv">${esc(l.from)} <span class="ar">→</span> <span class="to">${esc(l.to)}</span></span></div>`).join('')
          + (ch.length > 3 ? `<span class="hint13">외 ${ch.length - 3}개 더 바뀜</span>` : '')
          + (!ch.length ? '<span class="hint14">아직 바꾼 수치가 없습니다. 가운데에서 값을 바꾸면 여기에 바뀌기 전과 후가 나옵니다.</span>' : '') + '</div></div>';
        if (p.descMsg) top += `<div class="warnbox" role="note">${I.boxWarn}<span>${esc(p.descMsg)}</span></div>`;
        if (p.v15Note) top += `<div class="warnbox" role="note">${I.boxWarn}<span>${esc(p.v15Note)}</span></div>`;
      } else top += '<p class="hint14" style="margin:0">왼쪽에서 타일을 고르면 카드 모습과 바뀐 수치가 여기 나옵니다.</p>';
      top += '</div>';
    } else {
      const p = S.gsel ? C.preview(S.gsel) : null, sumLine = p ? p.lines.find(l => l.k === 'sum' || l.label === '효과') : null;
      top = `<div class="rblock"><h2>영향 범위</h2><p style="margin:0;font-size:15px">${esc(p ? p.scope : '')}</p>${sumLine ? `<p class="hint13" style="margin:0">지금 값 — ${esc(sumLine.text)}</p>` : ''}${p && p.v15Note ? `<div class="warnbox" role="note">${I.boxWarn}<span>${esc(p.v15Note)}</span></div>` : ''}<p class="hint13" style="margin:0">전역 수치는 여러 타일에 한꺼번에 적용됩니다. 시간 스폰·야전 회복·예고는 B 전용이며 다른 수치는 A/B 공통입니다. 새 출격으로 비교하세요. 대량 시뮬은 현재 보류 중입니다.</p></div>`;
    }
    r.innerHTML = top + simHtml() + checksHtml();
  }
  function renderSimOnly() { if (S.tab === 'history') return; const r = $('#right'), old = r.querySelectorAll('.rblock'); const blk = old[old.length - 1]; if (!blk) { renderRight(); return; } const t = document.createElement('div'); t.innerHTML = simHtml(); blk.replaceWith(t.firstChild); }
  /* ---------- 저장 확인 창 ---------- */
  function openSave() {
    const list = C.pendingChanges(), st = S.simSt, res = st && st.state === 'done' ? st.result : null;
    const simLine = res && !C.sim.isStale(res).stale ? C.sim.saveLine(res) : '아직 이 값으로 빠른 시뮬을 돌리지 않았습니다. 저장은 할 수 있습니다.';
    const lead = S.srv.save ? `바뀐 항목 ${list.length}개를 balance/overrides.json 에 기록합니다. 게임을 새로 고치면 바로 적용되고, 빌드에도 들어갑니다.` : `바뀐 항목 ${list.length}개를 overrides.json 파일로 내려받습니다. ${C.NO_SERVER} — 받은 파일을 보관하거나 개발자에게 전달하세요. 공개 게임은 별도 배포 후 반영됩니다.`;
    const d = $('#saveDlg');
    d.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="lg-save-t"><h2 id="lg-save-t">저장할까요?</h2><p>${esc(lead)}</p><div class="dlist">`
      + list.map(x => `<div class="d"><span>${esc(x.where)}</span><span class="ft">${esc(x.fromText)} → ${esc(x.toText)}</span><span class="pill">${esc(x.diffText)}</span></div>`).join('')
      + `</div><div class="memo"><label for="lg-memo">메모 (선택)</label><input id="lg-memo" type="text" maxlength="200" placeholder="왜 바꿨는지 한 줄로 남겨 두세요"></div><p class="sm">${esc(simLine)}</p>`
      + '<div class="dbtns"><button type="button" class="bbtn" id="bSaveX">취소</button><button type="button" class="okbtn" id="bSaveOk">저장</button></div></div>';
    d.hidden = false; setTimeout(() => { const m = $('#lg-memo'); if (m) m.focus(); }, 30);
  }
  const closeSave = () => { $('#saveDlg').hidden = true; $('#saveDlg').innerHTML = ''; };

  function renderAll() { renderHead(); const overview=S.tab==='overview'; document.body.classList.toggle('overview-mode',overview); $('#balanceOverview').hidden=!overview; $('.main').hidden=overview; if(overview){window.BalanceOverview.render();return;} renderLeftHead(); renderLeft(); renderCenter(); renderRight(); }
  function afterChange() { if(S.tab==='overview'){renderAll();return;} renderHead(); renderLeft(); if (S.drag) patchRowAll(); else renderCenter(); renderRight(); }
  function patchRowAll() { for (const el of document.querySelectorAll('[data-row]')) patchRow(el.dataset.row); }
  C.on('change', afterChange);

  function watchSim() {
    if (S.simStop) S.simStop();
    S.simStop = C.sim.watch(st => { S.simSt = st; if (st.state === 'running') renderSimOnly(); else renderRight(); });
  }

  /* ---------- 입력 ---------- */
  document.addEventListener('click', ev => {
    const t = ev.target.closest('button'); if (!t || t.disabled) return;
    if (t.dataset.tab) { S.tab = t.dataset.tab; renderAll(); return; }
    if (t.dataset.cat) { S.cat = t.dataset.cat; S.q = ''; const q = $('#lg-q'); if (q) q.value = ''; renderLeft(); return; }
    if (t.dataset.g) { S.sel = t.dataset.g; renderLeft(); renderCenter(); renderRight(); return; }
    if (t.dataset.gg) { S.gsel = t.dataset.gg; renderLeft(); renderCenter(); renderRight(); return; }
    if (t.dataset.h) { S.hsel = +t.dataset.h; renderLeft(); renderCenter(); return; }
    if (t.dataset.reset) { C.reset(t.dataset.reset); return; }
    switch (t.id) {
      case 'bUndo': { const r = C.undo(); if (r.ok) toast(`되돌렸습니다 — ${r.label}`); break; }
      case 'bReset': case 'bResetAll2': { const n = C.resetAll(); if (n) toast(`${n}개 값을 기본값으로 돌렸습니다 · 되돌리기로 취소할 수 있습니다`); break; }
      case 'bResetCard': { const n = C.resetGroup(S.sel); if (n) toast(`이 타일의 ${n}개 값을 기본값으로 돌렸습니다`); break; }
      case 'bSave': openSave(); break;
      case 'bSaveX': closeSave(); break;
      case 'bSaveOk': {
        const memo = ($('#lg-memo') || {}).value || '';
        t.disabled = true;
        C.save({ memo }).then(r => { if (r.ok) { closeSave(); S.hsel = 0; renderAll(); toast(r.msg, r.mode === 'server'); } else { t.disabled = false; toast(r.msg); } });
        break;
      }
      case 'toastUndo': case 'bUndoSave': {
        $('#toast').hidden = true;
        C.undoLastSave().then(r => { S.hsel = 0; renderAll(); toast(r.ok ? '마지막 저장을 되돌렸습니다' : r.msg); });
        break;
      }
      case 'bSim': C.sim.start({ group: S.tab === 'tile' ? S.sel : S.gsel }).then(r => { if (!r.ok) { toast(r.msg); return; } S.simSt = { state: 'running', done: 0, total: r.total }; renderRight(); watchSim(); }); break;
      case 'bSimX': C.sim.cancel(); break;
      case 'bExport': toast(C.exportFile({}).msg); break;
      case 'bExportAll': C.exportFile({all:true,name:'balance-full.json'}); toast('전체 현재 수치를 내려받았습니다 · 가져오기에서 다시 열 수 있습니다'); break;
      case 'bImport': $('#fImport').click(); break;
      case 'bRestore': { const r = C.restoreBackup(); toast(r.msg); break; }
      default: break;
    }
  });
  document.addEventListener('input', ev => {
    const t = ev.target;
    if (t.id === 'lg-q') { S.q = t.value; renderLeft(); return; }
    if (t.type === 'range' && t.dataset.p) { S.drag = true; C.set(t.dataset.p, C.parseInput(t.dataset.p, t.value).value); }
  });
  document.addEventListener('change', ev => {
    const t = ev.target;
    if (t.type === 'range' && t.dataset.p) { S.drag = false; renderCenter(); return; }
    if (t.id === 'fImport') {
      const f = t.files && t.files[0]; if (!f) return;
      const fr = new FileReader();
      fr.onload = () => { const r = C.importText(String(fr.result)); S.lastImport = r.ok ? r : null; renderAll(); toast(r.msg); };
      fr.readAsText(f); t.value = ''; return;
    }
    if (t.dataset.p && (t.type === 'number' || t.tagName === 'SELECT')) {
      const p = C.parseInput(t.dataset.p, t.value);
      C.set(t.dataset.p, p.ok ? p.value : (String(t.value).trim() === '' ? '' : p.value));
    }
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && !$('#saveDlg').hidden) { closeSave(); return; }
    if (ev.key === 'Enter' && ev.target && ev.target.id === 'lg-memo') { const b = $('#bSaveOk'); if (b) b.click(); return; }
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { ev.preventDefault(); const r = C.undo(); if (r.ok) toast(`되돌렸습니다 — ${r.label}`); }
  });
  window.addEventListener('beforeunload', ev => { if (C.summary().unsaved) { ev.preventDefault(); ev.returnValue = ''; } });

  renderAll();
  window.BalanceUI = { refresh: renderAll, watchSim, select(id){const g=C.group(id);if(!g)return;S.tab=g.card&&g.cat!=='global'?'tile':'global';if(S.tab==='tile'){S.sel=id;S.cat=g.cat;S.q='';}else S.gsel=id;renderAll();} }; /* 점검·확장용 손잡이(헤드리스 점검이 작은 시뮬을 붙여 볼 때) */
  C.server().then(s => {
    S.srv = s;
    if (!s.ok) { $('#noticeText').textContent = `외부 편집판 · 저장은 JSON 다운로드입니다. 파일 · 변경 이력에서 불러올 수 있습니다. 공개 게임 반영은 별도 배포가 필요합니다.`; $('#notice').hidden = false; }
    renderRight();
    if (s.sim) C.sim.status().then(st => { if (st.state === 'running') watchSim(); else if (st.state === 'done' && st.result && !C.sim.isStale(st.result).stale) { S.simSt = st; renderRight(); } });
  });
})();
</script>
<script>/* Static editor: isolated playable sessions and JSON handoff; live game saves are never changed. */
(function(){
 'use strict';
 const C=window.BalanceCore;
 document.querySelector('#publicFiles').addEventListener('click',event=>{
  const button=event.target.closest('[data-public-action]');if(!button)return;
  const action=button.dataset.publicAction;
  if(action==='import'){document.querySelector('#fImport').click();return;}
  if(!C.canSave().ok){
   document.querySelector('#publicFileStatus').textContent='빨간 오류 항목을 수정한 뒤 저장하세요.';return;
  }
  if(action==='test'){
   try{
    const id=crypto.randomUUID();
    const data=JSON.parse(C.exportText({all:true}));
    const envelope={gameVersion:window.LG_BALANCE_GAME_VERSION,label:'편집 중인 수치',data};
    localStorage.setItem('lg.balance.handoff:'+id,JSON.stringify(envelope));
    const opened=window.open('test.html#'+id,'_blank');
    if(opened)opened.opener=null;
    else{
     localStorage.removeItem('lg.balance.handoff:'+id);
     throw Error('팝업을 허용한 뒤 다시 누르세요. JSON 저장 후 테스트 페이지에서 불러올 수도 있습니다.');
    }
    document.querySelector('#publicFileStatus').textContent='별도 테스트 탭을 열었습니다.';
   }catch(error){document.querySelector('#publicFileStatus').textContent=error.message;}
   return;
  }
  C.exportFile(action==='all'?{all:true,name:'balance-full.json'}:{record:true});
  document.querySelector('#publicFileStatus').textContent=
   'JSON을 내려받았습니다. 다시 불러와 편집하거나 적용할 파일로 전달하세요.';
 });
})();
</script></body>
</html>
