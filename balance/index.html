<style>

const fxRand=(()=>{let a=((typeof Date!=='undefined'?Date.now():0)^0x9E3779B9)>>>0;return ()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};})();

<script>
'use strict';
/* Facilities open gradually; already-open and purchased facilities never close. */
BAL.office=Object.assign({store:1,med:2,range:3,ops:4,lab:5},BAL.office||{});
const OFFICE_FACILITY_ORDER=['store','med','range','ops','lab'];
function officeCount(value){return Number.isFinite(+value)?Math.max(0,Math.floor(+value)):0;}
function officeThreshold(id){
 const i=OFFICE_FACILITY_ORDER.indexOf(id);if(i<0)return null;
 // Keep the promised order even when individual thresholds are tuned.
 return Math.max(...OFFICE_FACILITY_ORDER.slice(0,i+1).map(k=>officeCount(BAL.office[k])));
}
function officeNormalize(m){
 if(!m)return null;
 if(!m.office||typeof m.office!=='object'||Array.isArray(m.office))m.office={};
 if(!m.office.opened||typeof m.office.opened!=='object'||Array.isArray(m.office.opened))m.office.opened={};
 const o=m.office.opened,returns=officeCount(m.runs),upg=m.upg||{};
 for(const f of FACILITIES){
  if(officeCount(upg[f.id])>0)o[f.id]=true;
  const threshold=officeThreshold(f.id);if(threshold!==null&&returns>=threshold)o[f.id]=true;
 }
 const injured=Object.values(m.trauma||{}).some(Boolean);
 const treated=m.traumaCenter&&officeCount(m.traumaCenter.used)>0;
 if(o.med||injured||treated)o.trauma=true;
 m.office.v=1;return m.office;
}
function officeFacilityOpen(id){
 if(!FACILITIES.some(f=>f.id===id))return false;
 return !!officeNormalize(meta).opened[id];
}
function officeFacilityName(id){
 const room=typeof ROOMS!=='undefined'&&ROOMS.find(r=>r.f===id),facility=FACILITIES.find(f=>f.id===id);
 return room?room.name:facility?facility.name:id;
}
function officeFacilityHint(id){
 if(!FACILITIES.some(f=>f.id===id))return '알 수 없는 시설';
 if(officeFacilityOpen(id))return '이용 가능';
 if(id==='trauma')return '첫 트라우마 발생 또는 의무실 개방 시 이용 가능';
 const needed=officeThreshold(id),remaining=Math.max(0,needed-officeCount(meta.runs));
 return `유효 출격 ${needed}회 종료 후 개방 · 앞으로 ${remaining}회`;
}
function officeRoomOpen(room){
 const r=typeof room==='string'?(typeof ROOMS!=='undefined'&&ROOMS.find(x=>x.id===room)):room;
 if(!r)return false;
 // Story archives, companions, quests and the skill tree remain accessible.
 return r.t==='fac'?officeFacilityOpen(r.f):true;
}
function officeNextUnlock(){
 const id=OFFICE_FACILITY_ORDER.find(k=>!officeFacilityOpen(k));if(!id)return null;
 const runs=officeThreshold(id);
 return {id,name:officeFacilityName(id),runs,remaining:Math.max(0,runs-officeCount(meta.runs)),hint:officeFacilityHint(id)};
}
Object.assign(window.GL=window.GL||{},{OFFICE_FACILITY_ORDER,officeNormalize,officeFacilityOpen,officeFacilityHint,officeRoomOpen,officeNextUnlock,officeThreshold});

function renderOfficeNavigation(){
 const host=document.getElementById('officeNav');if(!host)return;
 const rooms=ROOMS.filter(officeRoomOpen),next=officeNextUnlock();
 host.innerHTML='<div class="office-heading"><b>LooP 사무소</b><span>원정을 마치며 공간을 하나씩 확장합니다.</span></div>'+rooms.map(r=>`<button class="office-room${HUB.acRoom===r.id?' on':''}" data-office-room="${r.id}"><b>${r.icon} ${r.name}</b><span>${r.desc}${r.f?' · Lv'+(meta.upg[r.f]||0):''}</span></button>`).join('')+(next?`<div class="office-next"><b>다음 확장 · ${next.name}</b><span>${next.hint}</span></div>`:'');
 host.querySelectorAll('[data-office-room]').forEach(b=>b.onclick=()=>{const r=roomOf(b.dataset.officeRoom);setAcTab(r.t,r.id);renderOfficeNavigation();});
}

</script>

  const {GROUP_DEFS,BAL_ITEMS}=BALANCE_GLOBAL_FIELDS;

  const RULES = [

  /* ---------- 경로 읽기·쓰기 (등록된 데이터 루트의 기존 키, 학생·게이트는 id로 조회) ---------- */
  const ROOTS = {CARDS, BAL, ENEMIES, SKILLS:Object.fromEntries(SKILLS.map(s=>[s.id,s])), FACILITIES:Object.fromEntries(FACILITIES.map(f=>[f.id,f])), RELICS:Object.fromEntries(RELICS.map(r=>[r.id,r])), STUDENTS:Object.fromEntries(STUDENTS.map(s=>[s.id,s])), GATES:Object.fromEntries(GATES.map(g=>[g.id,g]))};
  const rootOf = n => ROOTS[n] || null;
  function getPath(p) { const s = String(p).split('.'); let o = rootOf(s[0]); for (let i = 1; i < s.length && o != null; i++) o = Object.prototype.hasOwnProperty.call(o, s[i]) ? o[s[i]] : undefined; return o; }
  function setPath(p, v) {
    const s = String(p).split('.'); let o = rootOf(s[0]);
    for (let i = 1; i < s.length - 1; i++) { if (!o || typeof o !== 'object' || !Object.prototype.hasOwnProperty.call(o, s[i])) return false; o = o[s[i]]; }
    const k = s[s.length - 1];
    if (!o || typeof o !== 'object' || !Object.prototype.hasOwnProperty.call(o, k)) return false;
    o[k] = v; return true;
  }
  const relGet = (o, rel) => { for (const k of rel.split('.')) { if (!isObj(o) || !Object.prototype.hasOwnProperty.call(o, k)) return undefined; o = o[k]; } return o; };

  /* ---------- 권장 범위·표시 ---------- */
  /* 따로 정하지 않은 카드 수치의 권장 범위(시안 공식): 정수·비율 = 기본값 × 0.6 ~ 1.5, 배율 = × 0.85 ~ 1.15. BAL_ITEMS · 무리 상한 · 등장 가중치 · 강화는 항목별로 정한 값 */
  function relRec(kind, d, hard) {
    const lo = hard ? hard[0] : 0, hi = hard ? hard[1] : Infinity, cl = v => Math.min(hi, Math.max(lo, v));
    if (kind === 'int' || kind === 'ms') { const u = kind === 'ms' ? 100 : 1; if (!d) return [lo, cl(lo + u)]; return [cl(Math.floor(d * 0.6 / u) * u), cl(Math.max(Math.ceil(d * 1.5 / u) * u, d + u))]; }
    if (kind === 'mul') return [cl(r4(d * 0.85)), cl(r4(d * 1.15))];
    if (!d) return [lo, cl(0.05)];
    return [cl(r4(d * 0.6)), cl(r4(d * 1.5))];
  }
  const STEP = { int: 1, num: 0.01, ms: 100, pct: 0.01, mul: 0.05 };
  function fmt(e, v) {
    if (v == null || v === '') return '—';
    if (e.kind === 'enum') { const i = e.opts.indexOf(v); return i >= 0 && e.labels ? e.labels[i] : String(v); }
    if (typeof v !== 'number') return String(v);
    if (e.kind === 'pct') return `${+(v * 100).toFixed(2)}%`;
    if (e.kind === 'mul') return `×${+v.toFixed(3)}`;
    if (e.kind === 'ms') return `${v}ms`;
    return String(v);
  }
  /* 규칙이 깨지는 값(저장 불가) — 사유 문장, 괜찮으면 '' */
  function badValue(e, v) {
    if (e.kind === 'enum') return typeof v === 'string' && e.opts.includes(v) ? '' : `허용 목록 밖(${e.opts.join('·')})`;
    if (typeof v !== 'number' || !isFinite(v)) return '숫자가 아님';
    if ((e.kind === 'int' || e.kind === 'ms') && !Number.isInteger(v)) return '정수만 가능';
    if (v < e.min) return e.min === 0 && v < 0 ? '음수 금지' : `허용 최소 ${fmt(e, e.min)} 미만`;
    if (v > e.max) return `허용 최대 ${fmt(e, e.max)} 초과${e.maxWhy ? ' — ' + e.maxWhy : ''}`;
    return '';
  }
  /* 권장 범위 밖(경고만) — 사유 문장, 괜찮으면 '' */
  function recWarn(e, v) {
    if (e.kind === 'enum') return e.rec && !e.rec.includes(v) ? '권장 목록 밖' : '';
    if (typeof v !== 'number') return '';
    if (v < e.rmin) return `권장 최소 ${fmt(e, e.rmin)} 미만`;
    if (v > e.rmax) return `권장 최대 ${fmt(e, e.rmax)} 초과`;

  }

  /* ---------- 등록표 만들기(불러올 때 한 번, 덮어쓰기 전 값 = 기본값) ---------- */
  const REG = [], BYP = {}, GBY = {}, GROUPS = [], MISSING = [];
  const addGroup = g => { if (!GBY[g.id]) { GBY[g.id] = { ...g, paths: [] }; GROUPS.push(GBY[g.id]); } return GBY[g.id]; };
  const cardGroup = id => addGroup({ id, cat: catOfCard(id), name: CARDS[id].name, icon: CARDS[id].icon || '', card: id, hint: '', scope: '' });
  function addEntry(e) {
    if (BYP[e.path]) return;
    const g = GBY[e.group];
    e.cat = g.cat; e.card = e.card || g.card || null; e.chain = g.chain || null;
    e.step = e.step || STEP[e.kind] || 1;
    REG.push(e); BYP[e.path] = e; g.paths.push(e.path);
  }
  const ENEMY_OPTS = Object.keys(ENEMIES).filter(k => !ENEMIES[k].boss);
  function cardEntry(id, rel, spec, prefix, pathRel, over) {
    const c = CARDS[id], [, name, kind, hard, desc, extra = {}] = spec, v = relGet(c, pathRel || rel);
    if (extra.only && !extra.only(id)) return;
    if (kind === 'enum' ? typeof v !== 'string' : !(typeof v === 'number' && isFinite(v))) return;
    const g = cardGroup(id), e = { path: `CARDS.${id}.${pathRel || rel}`, name: (prefix || '') + name, kind, def: v, group: g.id, card: id, desc };
    if (kind === 'enum') {
      e.opts = extra.opts || (rel === 'spawn' ? ENEMY_OPTS : [v]);
      e.labels = extra.labels || (rel === 'spawn' ? e.opts.map(k => ENEMIES[k].name)
        : e.opts.map(o => ({ 1: '1칸', h2: '가로 2칸', v2: '세로 2칸' }[o] || o)));
      e.rec = rel === 'spawn' ? SPAWN_REC.slice() : e.opts.slice();
    } else {
      e.min = hard[0]; e.max = hard[1];
      const rr = (over && over.rec) || extra.rec || (rel === 'cap' ? [Math.max(1, v - 1), Math.min(hard[1], v + 1)] : rel === 'w' ? [Math.max(1, v - 1), Math.min(hard[1], v * 2)] : relRec(kind, v, hard));
      e.rmin = rr[0]; e.rmax = rr[1];
    }
    if (over) Object.assign(e, over.set || {});
    addEntry(e);
  }
  for (const g of GROUP_DEFS) addGroup(g);
  for (const id of Object.keys(CARDS)) {
    const c = CARDS[id];
    for (const spec of CARD_FIELDS) cardEntry(id, spec[0], spec);
    /* 동아리 강화(§17.3 B 상한: 비율 +30%p · 정수 +1, 예외는 enh.cap) — 상한을 넘으면 저장 불가 */
    if (isObj(c.enh)) {
      const cap = c.enh.cap || 1;
      for (const grp of ENH_GROUPS) for (const k of Object.keys(isObj(c.enh[grp]) ? c.enh[grp] : {})) {
        const spec = FIELD_BY_REL[`${grp}.${k}`]; if (!spec) continue;
        const ratio = spec[2] === 'pct', mx = ratio ? 0.3 : cap;
        cardEntry(id, `${grp}.${k}`, spec, '강화 · ', `enh.${grp}.${k}`, { rec: [0, mx], set: { min: 0, max: mx, maxWhy: `§17.3 B 동아리 강화 상한 ${ratio ? '+30%p' : '+' + cap}`, desc: `동아리 강화(분대에 같은 동아리 학생) 때 더하는 값 — ${spec[1]}` } });
      }
    }
  }
  for (const [path, name, kind, hard, rec, desc, group, extra = {}] of BAL_ITEMS) {
    const v = getPath(path);
    if (kind === 'enum' ? !(typeof v === 'string' && extra.opts.includes(v)) : !(typeof v === 'number' && isFinite(v))) { MISSING.push(path); continue; }
    if (!GBY[group]) { if (CARDS[group]) cardGroup(group); else { MISSING.push(path); continue; } }
    const e = kind === 'enum'
      ? { path, name, kind, def: v, opts: extra.opts.slice(), labels: extra.labels.slice(), rec: extra.opts.slice(), desc, group }
      : { path, name, kind, def: v, min: hard[0], max: hard[1], rmin: rec[0], rmax: rec[1], desc, group, step: extra.step, descCards: extra.desc2 || null };
    if (extra.v15) { e.v15 = true; GBY[group].v15 = true; }

  }

  for (let i = GROUPS.length - 1; i >= 0; i--) if (!GROUPS[i].paths.length) { delete GBY[GROUPS[i].id]; GROUPS.splice(i, 1); }
  /* 목록 순서: 분류 순 → 전역 묶음 먼저 → 카드(CARDS 순) */
  const CAT_I = Object.fromEntries(CATS.map((c, i) => [c.id, i]));
  GROUPS.sort((a, b) => (CAT_I[a.cat] - CAT_I[b.cat]) || ((a.card ? 1 : 0) - (b.card ? 1 : 0)));

  /* ---------- 검사 · 적용 ---------- */
  /* values = {경로: 값}(기본값과 다른 것만) → {errors:[{path,msg}] 저장 불가, warns:[{path|rule,msg}] 경고} */
  function check(values) {
    const out = { errors: [], warns: [] }, vals = isObj(values) ? values : {};

      const e = BYP[p];
      if (!e) { out.errors.push({ path: p, msg: '등록되지 않은 항목' }); continue; }
      const bad = badValue(e, vals[p]);
      if (bad) out.errors.push({ path: p, msg: bad });
      else { const w = recWarn(e, vals[p]); if (w) out.warns.push({ path: p, msg: w }); }
    }
    for (const r of RULES) {
      let m = '';
      try { m = r.test(v => { const x = g(v); return typeof x === 'number' ? x : NaN; }); } catch (err) { m = '검사 실패'; }
      if (m) out.warns.push({ rule: r.id, name: r.name, msg: m, paths: r.paths });
    }
    return out;
  }
  function apply(o) {
    const res = { applied: [], skipped: [] };
    if (o == null) return res;
    if (!isObj(o)) res.skipped.push({ path: '*', why: '형식 오류(객체 아님)' });
    else if (o.v !== VERSION) res.skipped.push({ path: '*', why: `지원하지 않는 형식 버전 ${JSON.stringify(o.v)}` });
    else if (o.values != null && !isObj(o.values)) res.skipped.push({ path: '*', why: 'values 가 객체가 아님' });
    else for (const p of Object.keys(o.values || {})) {
      const e = BYP[p], v = o.values[p];
      if (!e) { res.skipped.push({ path: p, why: '등록되지 않은 항목' }); continue; }
      const bad = badValue(e, v);
      if (bad) { res.skipped.push({ path: p, why: bad }); continue; }
      if (setPath(p, v)) res.applied.push(p); else res.skipped.push({ path: p, why: '경로 없음' });
    }
    if (res.skipped.length && typeof console !== 'undefined') console.warn(`[밸런스] 덮어쓰기 ${res.skipped.length}개를 건너뜀(게임은 그 항목만 기본값): ` + res.skipped.slice(0, 5).map(s => `${s.path} — ${s.why}`).join(' / '));
    return res;
  }
  const LOAD = apply(typeof window !== 'undefined' ? window.LG_OVERRIDES : null);
  window.LG_BALANCE = {
    VERSION, CATS, GROUPS, REG, RULES, MISSING, load: LOAD,
    byPath: p => BYP[p] || null, group: id => GBY[id] || null, catOfCard, hasCard: id => typeof id === 'string' && Object.prototype.hasOwnProperty.call(CARDS, id),
    getPath, setPath, fmt, badValue, recWarn, check, apply,
  };
})();

'use strict';
/* ===== §27.6 재화 개편(econ2) 공통 함수 · 표 — 단계 1 =====
 * 로드 순서: data.js → balance/overrides.js → src/balance.js → 이 파일 → game.js.
 * 재화 개편은 기본 켬. 명시적으로 저장한 켬/끔 선택은 첫 세이브 로드 전에 복원한다.
 * 규칙: docs/DESIGN.md §27.4-2(소유자 결정 2차) · §27.6 a~q. 수치는 모두 시작값(BAL.econ) — 밸런스 도구 「재화 개편」 묶음에서 조정한다.
 * 여기 함수는 난수를 쓰지 않고 run · meta 를 읽지 않는다(회귀 econ2 가 이것만으로 검사한다) — BAL(수치)만 읽고, 상태는 인자로 받아 그 인자를 고쳐 쓴다. */
try{const pref=localStorage.getItem('gateloop_econ2_on');if(pref==='0'||pref==='1')BAL.econ2=pref==='1';}catch(e){}
const ECON = (() => {
  const B = () => ((typeof BAL === 'object' && BAL && BAL.econ) ? BAL.econ : {});
  const on = () => !!(typeof BAL === 'object' && BAL && BAL.econ2);
  const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
  const EPS = 1e-9;
  const own = (o, k) => !!o && Object.prototype.hasOwnProperty.call(o, k);
  /* 소수 잔액은 늘 0 이상 1 미만으로 — 내림의 오차가 음수로 남지 않게 한다 */
  const normFrac = f => { const v = num(f, 0); if (!(v > EPS)) return 0; return v >= 1 ? v - Math.floor(v) : v; };
  const int0 = v => { const n = num(v, 0); return n > 0 ? Math.floor(n) : 0; };

  /* ---- 자원 표(a A-3 · l-1): 분류 → 묶음 → 종류. 단계(기초 · 심화 · 비전)는 게이트가 정한다 ---- */
  const CLASSES = [
    { id: 'char', name: '캐릭터 소재', hud: '캐릭터' },
    { id: 'mem', name: '기억', hud: '기억' },
    { id: 'guild', name: '사무소 자재', hud: '사무소' },
  ];
  const SCHOOL_IDS = ['hansung', 'dorim', 'eunha'];
  const ROLE_IDS = ['dps', 'tank', 'sup'];
  const ROLE_CORE = { dps: '전투 코어', tank: '장갑 코어', sup: '마력 코어' };
  const TIERS = [
    { id: 1, name: '기초', gates: ['E', 'D'] },
    { id: 2, name: '심화', gates: ['C', 'B'] },
    { id: 3, name: '비전', gates: ['A', 'S'] },
  ];
  const schoolShort = id => {
    const s = (typeof SCHOOLS === 'object' && SCHOOLS && SCHOOLS[id]) ? SCHOOLS[id] : null;
    return s ? (s.short || s.abbr || id) : id;
  };
  const bookId = (school, tier) => 'book_' + school + '_t' + tier;
  const coreId = (role, tier) => 'core_' + role + '_t' + tier;
  const DEFS = (() => {
    const m = {};
    for (const t of TIERS) {
      for (const s of SCHOOL_IDS) m[bookId(s, t.id)] = { id: bookId(s, t.id), cls: 'char', group: 'book', school: s, tier: t.id, name: schoolShort(s) + ' 교본(' + t.name + ')', chip: 'book' };
      for (const r of ROLE_IDS) m[coreId(r, t.id)] = { id: coreId(r, t.id), cls: 'char', group: 'core', role: r, tier: t.id, name: ROLE_CORE[r] + '(' + t.name + ')', chip: 'core' };
    }
    m.mem = { id: 'mem', cls: 'mem', group: 'mem', name: '기억 조각', chip: 'mem' };
    m.stone = { id: 'stone', cls: 'guild', group: 'guild', name: '결계석', chip: 'stone' };
    m.rec = { id: 'rec', cls: 'guild', group: 'guild', name: '기록', chip: 'rec' };
    m.part = { id: 'part', cls: 'guild', group: 'guild', name: '부품', chip: 'part' };
    return m;
  })();
  const defOf = k => (typeof k === 'string' && own(DEFS, k)) ? DEFS[k] : null;
  const classOf = k => { const d = defOf(k); return d ? d.cls : null; };
  const tierOfGate = g => {
    for (const t of TIERS) if (t.gates.indexOf(g) >= 0) return t.id;
    return 1;
  };
  const tierName = t => (TIERS.find(x => x.id === t) || TIERS[0]).name;

  /* ---- 태그 → 종류(l-2): 행동은 종류가 아니라 태그로 자원을 청한다 ---- */
  const KIND_ROLE = { machine: 'tank', spirit: 'sup', fluid: 'sup', beast: 'dps', human: 'dps', phantom: 'dps' };
  const enemyKind = id => {
    const e = (typeof ENEMIES === 'object' && ENEMIES && ENEMIES[id]) ? ENEMIES[id] : null;
    return e ? (e.kind || null) : null;
  };
  /* ctx = {gate, school(서명 주인 학원), enemy(이형 id) 또는 kind(계열), role, kind(고정 종류 — mission)} */
  const valid = k => (defOf(k) ? k : null);
  function kindFor(tag, ctx) {
    ctx = ctx || {};
    const tier = ctx.tier || tierOfGate(ctx.gate);
    switch (tag) {
      case 'sig': case 'morph': case 'book':
        return ctx.school ? valid(bookId(ctx.school, tier)) : null;
      case 'kind': case 'core': {
        const k = ctx.kind || enemyKind(ctx.enemy), role = ctx.role || (own(KIND_ROLE, k) ? KIND_ROLE[k] : null);
        return role ? valid(coreId(role, tier)) : null;
      }
      case 'observatory': return valid(coreId('sup', tier));
      case 'boss': return 'mem';
      case 'terrain': case 'vein': return 'stone';
      case 'pass': case 'combo': case 'goal': case 'county': case 'codex': return 'rec';
      case 'gear': case 'machine': return 'part';
      case 'mission': return valid(ctx.kind);
      default: return null;
    }
  }
  /* 한 번에 여러 종류를 주는 보상(협회 의뢰 · 과제 — a ⑥): {종류: 양} */
  function bundleFor(tag, ctx) {
    ctx = ctx || {};
    const tier = ctx.tier || tierOfGate(ctx.gate), r0 = B().res || {}, out = {};
    if (tag === 'quest') {
      const n = num(r0.quest, 2);
      const bk = ctx.school ? valid(bookId(ctx.school, tier)) : null, co = ctx.role ? valid(coreId(ctx.role, tier)) : null;
      if (bk) out[bk] = n;
      if (co) out[co] = n;
      if (ctx.mem > 0) out.mem = int0(ctx.mem);
      return out;
    }
    if (tag === 'mission') { const k = valid(ctx.kind); if (k) out[k] = int0(num(ctx.n, r0.mission)); return out; }
    const k = kindFor(tag, ctx);
    if (k) out[k] = int0(amountFor(tag, ctx));
    return out;
  }
  /* 태그 기본 지급량(BAL.econ.res) — 변이체 · 엘리트는 elite 값 */
  function amountFor(tag, ctx) {
    const r = B().res || {}, c = ctx || {};
    if (tag === 'sig') return num(c.morphed ? r.sigMorph : r.sig, c.morphed ? 2 : 1);
    if (tag === 'kind') return num(c.elite ? r.elite : r.kind, c.elite ? 2 : 1);
    if (tag === 'vein') return num(c.grove ? r.grove : r.vein, c.grove ? 2 : 1);
    return num(r[tag], 1);
  }

  /* ---- 종류별 상한(l-3): 분류 공통 상한은 두지 않는다 ---- */
  function capOf(kind, gate) {
    const d = defOf(kind); if (!d) return 0;
    if (d.cls === 'mem') return Infinity;
    const cap = B().cap || {}, t = (d.cls === 'guild' ? cap.guild : cap.kind) || {};
    return num(t[gate], d.cls === 'guild' ? 4 : 5);
  }
  /* 수집: 상한을 넘는 몫은 버린다. res 를 고쳐 쓰고 실제로 받은 양을 돌려준다 */
  function gainRes(res, kind, n, gate) {
    const want = int0(n);
    if (!res || !defOf(kind) || want <= 0) return 0;
    const room = capOf(kind, gate) - num(res[kind], 0);
    const g = Math.max(0, Math.min(want, room));
    if (g > 0) res[kind] = (res[kind] || 0) + g;
    return g;
  }
  const capped = (res, kind, gate) => !!defOf(kind) && !!res && num(res[kind], 0) >= capOf(kind, gate);

  /* ---- 계약 감쇠(b C-1): 순번 n(그 칸 계약의 몇 번째 유효 정산, 0부터) ---- */
  const decayTable = () => { const d = B().decay; return Array.isArray(d) && d.length ? d : [1, 0.75, 0.5, 0.25]; };
  function payRate(n, floor) {
    const t = decayTable(), base = (n >= 0 && n < t.length) ? num(t[n], 0) : 0;
    return Math.max(base, num(floor, 0));
  }
  const expired = (n, floor) => payRate(n, floor) <= 0;

  /* 하한 타일(k): 옆 길가 칸의 공장이 그 소환 칸의 하한을 올린다 */
  const FLOOR_CARDS = {
    fac_slime: { spawn: 'slime', name: '슬라임 공장' },
    fac_golem: { spawn: 'golem', name: '고철 처리장' },
    fac_hound: { spawn: 'hound', name: '사육장' },
    fac_wisp: { spawn: 'wisp', name: '마나 우물' },
  };
  /* tileSpawn = 그 칸이 부르는 이형 id, neighbors = 옆 칸 카드 id 목록. 공장이 겹쳐도 더하지 않는다 */
  function payFloorFor(tileSpawn, neighbors) {
    if (!tileSpawn || !Array.isArray(neighbors)) return 0;
    const pct = num((B().floor || {}).pct, 0.5);
    for (const id of neighbors) { const f = FLOOR_CARDS[id]; if (f && f.spawn === tileSpawn) return pct; }
    return 0;
  }
  /* 공장 대가: 그 칸은 캠프마다 무리를 하나 더 부르고 상한도 +1(겹쳐도 한 번) */
  const floorCap = has => (has ? Math.max(0, Math.round(num((B().floor || {}).cap, 1))) : 0);

  /* ---- OP 지급(b C-2): 모든 수입은 이 함수 하나로. 소수는 누적해 다음 지급에 넘긴다 ---- */
  function gainOp(st, v) {
    if (!st) return 0;
    const add = Math.max(0, num(v, 0)), total = add + normFrac(st.opFrac);
    const g = Math.floor(total + EPS);
    st.opFrac = normFrac(total - g);
    st.op = num(st.op, 0) + g;
    return g;
  }
  /* 계약 한 건의 지급액(정수 전) = 기본 × 감쇠(또는 하한) × 배율 × (1 + 가산 합계) */
  function contractValue(o) {
    o = o || {};
    const base = num(o.base, 0) * num(B().contractOp, 70);
    return base * payRate(num(o.n, 0), o.floor) * num(o.mul, 1) * (1 + num(o.add, 0));
  }
  /* 계약금(C-2): 소환 카드 한 장당 첫 유효 정산 때 한 번 */
  const deposit = () => num(B().deposit, 100);

  /* ---- 가격(c C-3): 함수 하나 · 10 OP 올림은 맨 마지막에 한 번 ---- */
  function price(base, ctx) {
    ctx = ctx || {};
    const e = B(), lc = e.lapCoef || {};
    const gateC = num(ctx.gateCoef, num(e.gateCoef, 1));
    const lapC = lc.on ? Math.min(num(lc.cap, 1.3), 1 + num(lc.slope, 0.05) * Math.max(0, num(ctx.lap, 1) - 1)) : 1;
    const disc = Math.min(num(e.discMax, 0.3), Math.max(0, num(ctx.disc, 0)));
    const round = Math.max(1, num((e.price || {}).round, 10));
    const v = Math.max(0, num(base, 0) + num(ctx.extra, 0)) * gateC * lapC * (1 - disc);
    return Math.max(0, Math.ceil(v / round - EPS) * round);
  }
  /* 교체 환급: 내림 · 이번 결제액의 절반을 넘지 않는다 */
  /* 교체 환급: 이번 팩 결제액(paid)이 있어야 준다 — 결제 없이 환급이 나오지 않게 한다 */
  function refund(star, ctx) {
    const e = B(), rf = e.refund || {}, round = Math.max(1, num((e.price || {}).round, 10));
    const paid = num((ctx || {}).paid, -1);
    if (!(paid >= 0)) return 0;
    const v = num(rf.base, 300) * Math.max(1, Math.floor(num(star, 1))) * num((ctx || {}).gateCoef, num(e.gateCoef, 1));
    return Math.max(0, Math.floor(Math.min(v, paid * num(rf.cap, 0.5)) / round) * round);
  }

  /* ---- 정산(a A-4): 수집 → 가져가기 비율 → 보스 보너스 → 평가 보너스 → 소수 누적 ---- */
  /* 끝낸 방식: 게임의 사유 이름(death · retreat)도 같은 칸을 본다 */
  const REASON_ALIAS = { death: 'wipe', retreat: 'emergency', escape: 'emergency', invalid: 'void' };
  const reasonOf = reason => (own(REASON_ALIAS, reason) ? REASON_ALIAS[reason] : reason);
  const keepPct = reason => {
    const k = B().keep || {}, id = reasonOf(reason);
    const t = { boss: num(k.boss, 1), camp: num(k.camp, 1), drone: num(k.drone, 0.5), emergency: num(k.emergency, 0.5), wipe: typeof META_V2_CONFIG!=='undefined'?META_V2_CONFIG.economy.wipeKeep:num(k.wipe, 0), void: num(k.void, 0) };
    return own(t, id) ? t[id] : 0;
  };
  /* 평가 보너스 상한은 §21.10 과 같은 값(BAL.bonus.max) */
  const evalOf = v => {
    const cap = (typeof BAL === 'object' && BAL && BAL.bonus) ? num(BAL.bonus.max, 0.2) : 0.2;
    return Math.min(Math.max(0, num(v, 0)), cap);
  };
  /* 보스 보너스(③): 분류마다 +1 — 열렸고 이번 원정에 실제로 모은 종류 중 가장 많이 모은 것. 기억은 보스 표 */
  function bossBonus(res, o) {
    o = o || {};
    const out = {}, open = o.open || null;
    const isOpen = k => !open || open.indexOf(k) >= 0;
    for (const c of CLASSES) {
      if (c.id === 'mem') continue;
      let best = null;
      for (const k of Object.keys(DEFS)) {
        if (classOf(k) !== c.id || !isOpen(k)) continue;
        const v = num((res || {})[k], 0);
        if (v > 0 && (best === null || v > num(res[best], 0))) best = k;
      }
      if (best) out[best] = (out[best] || 0) + 1;
    }
    const bt = B().boss || {};
    const memN = num(bt[o.gate], 0) + (o.firstClear ? num(bt.first, 2) : 0);
    if (memN > 0) out.mem = (out.mem || 0) + memN;
    return out;
  }
  /* input = {res, lootMul(획득 자원만 배율), reason, gate, evalBonus, frac, boss(보스 처치면 true), firstClear, open}
   * 반환 {grant 종류별 정수, frac 다음으로 넘길 소수, keep 비율} — frac 은 새 객체(입력을 고치지 않는다) */
  function settle(input) {
    input = input || {};
    const res = input.res || {}, reason = reasonOf(input.reason), keep = keepPct(input.reason);
    const frac = Object.assign({}, input.frac || {});
    /* 무효 출격은 아무것도 주지 않고 소수 누적도 건드리지 않는다(a) */
    if (reason === 'void') return { grant: {}, frac, keep: 0 };
    const ev = evalOf(input.evalBonus);
    const bonus = reason === 'boss' ? bossBonus(res, input) : {};
    const grant = {};
    const kinds = new Set(Object.keys(res).concat(Object.keys(bonus)));
    for (const k of kinds) {
      if (!defOf(k)) continue;
      const isMem = classOf(k) === 'mem';
      if(isMem&&reason!=='boss')continue;
      let v = Math.max(0, num(res[k], 0)) * Math.max(1, num(input.lootMul, 1)) * keep + num(bonus[k], 0);
      if (!isMem) v *= (1 + ev);
      const total = v + normFrac(frac[k]);
      const g = Math.floor(total + EPS);
      grant[k] = g;
      frac[k] = normFrac(total - g);
    }
    return { grant, frac, keep };
  }
  /* SP 도 같은 비율 · 같은 순서(a) */
  /* SP: (분대 레벨 − 1) × 비율 + 보스 처치면 게이트 SP → 평가 보너스 → 소수 누적(a) */
  function settleSp(sp, input) {
    input = input || {};
    const reason = reasonOf(input.reason), keep = keepPct(input.reason);
    if (reason === 'void') return { grant: 0, frac: normFrac(input.frac), keep: 0 };
    const boss = reason === 'boss' ? Math.max(0, num(input.bossSp, 0)) : 0;
    const v = (Math.max(0, num(sp, 0)) * keep + boss) * (1 + evalOf(input.evalBonus)) + normFrac(input.frac);
    const g = Math.floor(v + EPS);
    return { grant: g, frac: normFrac(v - g), keep };
  }

  /* ---- 학생 성장(l-4): Lv 1~10, 그 학생의 학원 교본 + 역할 코어(+ 높은 Lv 는 기억 조각) ---- */
  const growthTable = () => { const g = B().growth; return Array.isArray(g) && g.length ? g : []; };
  const growthMax = () => growthTable().length;
  /* lv = 올리려는 Lv(1부터). 반환 {kind:양} — 학원 · 역할은 그 학생 것, 단계는 표가 정한다 */
  function growthCost(lv, school, role) {
    const t = growthTable(), n = num(lv, 0), row = (n >= 1 && n <= t.length) ? t[Math.floor(n) - 1] : null;
    if (!row) return null;
    const [book, core, tier, mem] = row, out = {};
    const bk = valid(bookId(school, tier)), co = valid(coreId(role, tier));
    if (book > 0) { if (!bk) return null; out[bk] = book; }
    if (core > 0) { if (!co) return null; out[co] = core; }
    if (mem > 0) out.mem = mem;
    return out;
  }
  /* 성장 효과: 능력치 +3%/Lv · Lv3 패시브 · Lv6 · 9 특효 +10%p · Lv10 EX 효과 +10% */
  function growthFx(lv) {
    const f = B().growthFx || {}, n = Math.min(growthMax(), Math.max(0, Math.floor(num(lv, 0))));
    const baneLv = Array.isArray(f.baneLv) ? f.baneLv : [6, 9];
    return {
      stat: 1 + (typeof META_V2_CONFIG!=='undefined'?META_V2_CONFIG.economy.growthStatPerLevel:num(f.stat, 0.03)) * n,
      passive: n >= num(f.passiveLv, 3),
      bane: baneLv.filter(x => n >= x).length * num(f.bane, 0.1),
      ex: n >= num(f.exLv, 10) ? num(f.ex, 0.1) : 0,
    };
  }

  /* ---- 4인 기준 고정(i) ---- */
  const partyMax = () => Math.max(1, Math.round(num(B().partyMax, 4)));
  /* 무리 크기: 인원과 무관하게 고정값. 군집 진화면 +1(지금 식은 상한만 올라 크기가 그대로였다) */
  function packSize(o) {
    o = o || {};
    const n = Math.max(1, Math.round(num(B().packFixed, 3))) + (o.swarm ? 1 : 0) + num(o.bonus, 0);
    if (o.elite) return 1;
    if (o.small) return Math.min(n, Math.max(1, num(o.markMax, 1)));
    return Math.max(1, n);
  }
  const bossHpMul = () => num(B().bossHpMul, 2.5);

  /* ---- 팩 보장 칸(d D-1a): 후보열 앞 두 자리에 들어갈 보장을 순서대로 고른다 ----
   * ctx = {partySize, roles(분대 역할 목록), promo(★3 미만 보유 학생 있음), dry(앞선 영입 팩 연속 희귀 0장 수)}
   * 반환 [{slot:'role'|'promo'|'rare', role?}] — 최대 2개, 희귀 천장은 앞 보장의 희귀도 조건으로 붙는다 */
  function guaranteeSlots(ctx) {
    ctx = ctx || {};
    const out = [], roles = ctx.roles || [], size = num(ctx.partySize, 0);
    if (size < partyMax()) {
      for (const r of ['tank', 'sup']) if (roles.indexOf(r) < 0) { out.push({ slot: 'role', role: r }); break; }
    }
    if (ctx.promo) out.push({ slot: 'promo' });
    const rare = num(ctx.dry, 0) >= num((B().pack || {}).dry, 2);
    if (rare) {
      if (out.length) out[0].rare = true;
      else out.push({ slot: 'rare' });
    }
    return out.slice(0, Math.max(1, num((B().pack || {}).slots, 2)));
  }

  /* ---- 계약 순번(b C-1): 순번은 (칸, 카드) 쌍을 따른다 ----
   * st = {payLog:{칸 id:{카드 id:순번}}, payCarry:{카드 개체 uid:순번}} — run 에서 받아 그 자리에서 고친다.

<script>
'use strict';
/* Eight-neighbour placement and four-neighbour movement deliberately use different queries. */
const MAP_CACHE = new Map();
function buildRegionMap(def) {
 const path=def.path.map(p=>p.slice()),roadIndex={},offIndex={},offCells=[],index={};
 path.forEach((p,i)=>{roadIndex[p.join(',')]=i;index[p.join(',')]=i;});
 for(let r=0;r<def.rows;r++)for(let c=0;c<def.cols;c++)if(roadIndex[c+','+r]==null){
  offIndex[c+','+r]=offCells.length;index[c+','+r]=path.length+offCells.length;offCells.push([c,r]);
 }
 const near=(a,b)=>Math.max(Math.abs(a[0]-b[0]),Math.abs(a[1]-b[1]))===1;
 const adj=(a,b)=>a.map(p=>b.map((q,i)=>near(p,q)?i:-1).filter(i=>i>=0));
 const roadAdj=adj(offCells,path),offAdj=adj(offCells,offCells),nearOff=adj(path,offCells);
 const out={...def,path,roadIndex,offIndex,offCells,index,roadAdj,offAdj,nearOff};
 out.xy=i=>i<path.length?path[i]:offCells[i-path.length];
 out.spot=(i,state)=>!state||i==null||i<0?null:(i<path.length?state.tiles?.[i]:state.cells?.[i-path.length])||null;
 out.center=i=>{const p=out.xy(i);return p?{x:PAD+p[0]*CELL+CELL/2,y:PAD_TOP+p[1]*CELL+CELL/2}:null;};
 return out;
}
function mapForRegion(region) {
 const id=typeof region==='string'?region:region?.id||region?.rank;
 const def=MAP_DEFINITIONS.find(m=>m.region===id||m.id===id);
 if(!def)throw Error('Unknown expedition region: '+id);
 return mapOf({mapId:def.id,mapVersion:def.version});
}
function mapOf(state) {
 const s=state===undefined?(typeof run!=='undefined'?run:null):state;
 const id=s?.mapId||'legacy',version=s?.mapVersion??(id==='legacy'?1:2),key=id+':'+version;
 if(MAP_CACHE.has(key))return MAP_CACHE.get(key);
 const def=id==='legacy'&&version===1
  ?{id,version,region:null,name:'기존 순환로',cols:COLS,rows:ROWS,camp:0,marks:[7,20],path:PATH}
  :MAP_DEFINITIONS.find(m=>m.id===id&&m.version===version);
 if(!def)throw Error('Unsupported saved map: '+key);
 const map=buildRegionMap(def);MAP_CACHE.set(key,map);return map;
}
function mapPinLegacy(state) {
 if(state&&!state.mapId){state.mapId='legacy';state.mapVersion=1;}
 return state?mapOf(state):null;
}
function mapInitRun(state,region) {
 if(!state)throw Error('Run required');
 if(state.mapId)return mapOf(state);

 state.mapId=m.id;state.mapVersion=m.version;

}
function boardGridFor(state) {

  xy:m.xy,at:(c,r)=>m.index[c+','+r]??-1,roadAdj:i=>i<n?[]:m.roadAdj[i-n]||[],
  offAdj:i=>i<n?[]:(m.offAdj[i-n]||[]).map(k=>n+k),
  nearOff:i=>(m.nearOff[i]||[]).map(k=>n+k),spot:(s,i)=>m.spot(i,s)};
}
Object.assign(window.GL=window.GL||{},{maps:{of:mapOf,forRegion:mapForRegion,init:mapInitRun,pinLegacy:mapPinLegacy}});

  if(sites.length===3)break;
  if(!sites.some(s=>Math.abs(s.p[0]-o.p[0])+Math.abs(s.p[1]-o.p[1])<3))sites.push(o);
 }

function mapActions(state) {

 if(m.mechanic==='rift'&&s.stabilized==null)return sites

function mapAction(state,id,target) {
 if(!state||state.ended||state.battle||state.pos!==0)return {ok:false,reason:'캠프에서만 선택할 수 있습니다'};

 if(id==='recover')s.recovered=[...(s.recovered||[]),target];
 if(id==='signal')s.signal=mapSites(state).sites.indexOf(target);
 if(id==='stabilize')s.stabilized=target;
 s.actions=(s.actions||0)+1;state.mapVer=(state.mapVer||0)+1;
 return {ok:true,...action};
}
function mapSupportEffects(tile,state) {
 const m=mapOf(state),out={dmg:0,shield:0,enemyAtk:1};
 if(!state||!tile||tile.off||tile.i===m.camp||m.id==='legacy')return out;

}

<script>
'use strict';
/* Road nodes retain physical support IDs, so one side tile cannot become several supply tiles. */
function metaChainGroups(cardAt,state=run) {
 const size=state.tiles.length;
 const tiles=Array.from({length:size},(_,i)=>({i,kind:i===0?'empty':
  chainClass(cardAt(i))==='S'?'spawn':chainClass(cardAt(i))==='U'?'support':'empty',
  supports:[],received:[]}));
 for(const tile of tiles)if(tile.kind==='support')tile.supports.push(tile.i);
 const seen=new Set();
 for(const cell of state.cells||[]){
  const c=CARDS[cell.card],key=cell.fp?.a??cell.i;
  if(seen.has(key)||!c||c.spawn||c.floor||c.type==='control'||!(c.sup||c.enter||c.pas||c.camp||c.field))continue;
  seen.add(key);
  for(const i of META_RULES.sourceRoads(state,cell)){
   if(!tiles[i]||i===0)continue;
   tiles[i].received.push(key);
   if(tiles[i].kind!=='spawn')tiles[i].supports.push(key);
  }
 }
 const links={spawn:META_RULES.boardLinks(state,tiles,'spawn'),
  support:META_RULES.boardLinks(state,tiles,'support')};
 if(!links.spawn.length&&!links.support.length)return null;
 const out=[];
 for(const kind of ['spawn','support']){
  const parent=Array.from({length:size},(_,i)=>i),root=i=>parent[i]===i?i:(parent[i]=root(parent[i]));
  const join=(a,b)=>{parent[root(a)]=root(b);};
  const projected=new Set(links[kind].flatMap(([a,,b])=>[a,b]));
  const member=i=>tiles[i].kind===kind||(kind==='support'&&projected.has(i)&&tiles[i].supports.length);
  for(let i=1;i<size-1;i++)if(member(i)&&member(i+1))join(i,i+1);
  for(const [a,,b] of links[kind])join(a,b);
  if(kind==='support'){
   const first=new Map();
   for(let i=1;i<size;i++)if(member(i))for(const source of tiles[i].supports){
    if(first.has(source))join(i,first.get(source));else first.set(source,i);
   }
  }
  const groups=new Map();
  for(let i=1;i<size;i++)if(member(i)){
   const key=root(i);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(i);
  }
  for(const cells of groups.values()){
   const sources=kind==='support'?[...new Set(cells.flatMap(i=>tiles[i].supports))]:cells;
   if(sources.length<2)continue;
   const tag=kind==='spawn'?(sources.length>=3?'battle':'front'):(sources.length>=3?'base':'supply');
   const chain={kind:tag,tiles:cells};
   if(kind==='support')chain.supportSources=sources.filter(i=>i>=size);
   out.push(chain);
  }
 }
 for(let i=2;i<size-1;i++)if(tiles[i].kind==='support'
  &&tiles[i-1].kind==='spawn'&&tiles[i+1].kind==='spawn')out.push({kind:'cycle',tiles:[i-1,i,i+1]});
 return out;
}

   shields:0,alive:0,rear:0,streak:0,maxStreak:0,elites:0,protectedElites:0,
   controls:0,toolElites:0,gearHits:0,promotions:0,paid:0,prepared:0,traits:{}};
  return r.metaV2;
 }
 function observe(m,r,e){
  if(!r||!e||challenge(r)||['scoreReplay','visual'].includes(e.origin))return false;
  const s=runState(r),key=String(e.eventId||'');if(!key||s.events[key])return false;
  s.events[key]=true;const type=e.type||e.kind;
  const p=state(m),g=e.region||region(r);p.introduced[g]=true;
  if(!s.introduced)s.introduced=regions().filter(id=>introduced(m,id));
  if(type==='packComplete'){
   if(e.origin&&e.origin!=='native')return false;
   const pack=e.packId;if(pack==null||e.boss||e.summoned||e.rewardEligible===false)return false;
   const pk=String(pack);if(s.packs[pk])return false;
   s.battles=s.battles||{};
   const battle=String(e.battleId??e.context?.battleId??pk),firstBattle=!s.battles[battle];
   s.battles[battle]=true;
   s.packs[pk]={region:g,site:e.siteId??e.tileIndex??e.context?.tileIndex??pk,elite:!!e.elite};
   s.sites[String(s.packs[pk].site)]=true;
   s.streak++;s.maxStreak=Math.max(s.maxStreak,s.streak);
   if(firstBattle&&e.allAlive){s.alive++;if(number(e.rearDamage)>0)s.rear++;}
   if(firstBattle)s.shields+=number(e.shieldAbsorbed);
   if(e.elite&&e.allAlive)s.elites++;
   const support=e.supportIds||[],facilities=e.facilityIds||[];
   for(const id of support)s.supports[String(id)]=true;
   for(const id of facilities){s.facilities[id]=s.facilities[id]||{};s.facilities[id][battle]=true;}
   if(e.elite&&e.allAlive&&number(e.damageTaken)>0&&(e.protected||number(e.shieldAbsorbed)>0)){
    s.protectedElites++;
   }
   if(firstBattle)s.controls+=integer(e.controlCount||e.controls);
   if(e.elite&&(e.tool||e.counterUsed))s.toolElites++;
   if(e.elite&&(e.prepared||e.preparationSupport))s.prepared++;
   if(firstBattle)s.gearHits+=integer(e.gearHits);
   for(const id of e.traits||(e.trait?[e.trait]:[]))s.traits[typeof id==='string'?id:id.id]=true;
   if(support.length&&Object.keys(s.packs).length>=2)p.sharedRegions[g]=true;
  }else if(type==='battleLost')s.streak=0;
  else if(type==='promotion')s.promotions++;
  else if(type==='purchase'&&number(e.paid??e.amount)>0)s.paid++;
  else if(type==='control'&&!e.boss)s.controls++;
  else if(type==='hit'&&(e.fastGear||e.multiHitGear))s.gearHits++;
  else if(type==='gearUsed'||type==='gearSalvaged'){
   for(const t of e.traits||(e.trait?[e.trait]:[])){
    const id=typeof t==='string'?t:t.id;if(id)s.traits[id]=true;
   }
  }
  return true;
 }
 function progress(r){
  const s=r?.metaV2;
  return {packs:s?Object.keys(s.packs||{}).length:(r?.metaVersion===2?0:integer(r?.wins)),
   sites:s?Object.keys(s.sites||{}).length:Math.min(integer(r?.wins),integer(r?.cardsPlaced)),
   support:s?Object.keys(s.supports||{}).length:0,
   facility:s?Math.max(0,...Object.values(s.facilities||{}).map(x=>Object.keys(x).length)):0};
 }
 function tasksFor(m,r,reason){
  const s=runState(r),x=progress(r),safe=['camp','boss'].includes(reason),p=state(m);
  return {start:true,return2:safe&&x.packs>=2,shield2:s.alive>=2&&s.shields>0,
   streak3:s.maxStreak>=3,facility2:x.facility>=2,eliteAlive:s.elites>0,
   budget:s.promotions>0&&s.paid>0,protectedElite:s.protectedElites>0,rear2:s.rear>=2,
   gearHits:s.gearHits>=12,controlElite:s.controls>=2&&s.toolElites>0,
   support3:s.alive>=3&&x.support>=2,shared2Regions:Object.keys(p.sharedRegions).length>=2,
   prepareElite:s.prepared>0,support:x.support>0&&x.packs>=2,elite:s.elites>0};
 }
 function ready(m,id){
  const d=defs().find(x=>x.id===id),p=state(m);
  const task=d&&p.tasks[d.task];
  return !!d&&!p.recruited[id]&&d.productionApproved!==false&&introduced(m,d.region)
   &&!!task&&(!task.eligibleRegions||task.eligibleRegions.includes(d.region));
 }
 function recruit(m,id){
  if(!ready(m,id))return false;const p=state(m),d=defs().find(x=>x.id===id);
  p.recruited[id]=true;p.meetings['meet_'+id]={source:d.task,evidence:p.tasks[d.task]};
  p.notices=p.notices.filter(x=>x!==id);
  if(!p.notices.length)p.notices=defs().filter(x=>ready(m,x.id)).slice(0,1).map(x=>x.id);

 }
 function recordReturn(m,r,reason){
  if(challenge(r)||r.valid===false||progress(r).packs<1)return [];
  const p=state(m),tasks=tasksFor(m,r,reason),g=region(r),earned=[];
  for(const [id,done] of Object.entries(tasks))if(done){
   const eligible=r.metaV2?.introduced||[g],previous=p.tasks[id]?.eligibleRegions||[];
   p.tasks[id]={region:g,runId:r.runId||r.campaign?.id||'legacy',packs:progress(r).packs,
    eligibleRegions:[...new Set([...previous,...eligible])]};
  }
  for(const [id,task] of Object.entries(config().progression.systems))if(p.tasks[task])p.systems[id]=true;
  for(const id of Object.keys(r.metaV2?.traits||{}))if(config().recipes.rows.some(d=>d.id===id)){
   p.recipeSeen[id]=true;
  }
  // One new encounter per return; other completed tasks remain available at the hub.
  const next=defs().find(d=>ready(m,d.id));
  if(next&&recruit(m,next.id))earned.push(next.id);
  p.notices=defs().filter(d=>ready(m,d.id)).slice(0,1).map(d=>d.id);
  return earned;
 }
 function lockHint(id,m){
  const d=defs().find(x=>x.id===id);if(!d||recruited(m,id))return '';
  return (d.productionApproved===false?'제작 승인 대기 · ':!introduced(m,d.region)?d.region+' 지역 소개 후 · ':'')+d.hint;
 }
 const systemOpen=(m,id)=>!!state(m).systems[id]||!!m.unlock?.[id];
 function relicOpen(m,id){
  const after=config().relics?.relics?.find(r=>r.id===id)?.after;
  if(after)return !!m.cleared?.[after]||!!state(m).seen['relic:'+id];
  const task=config().progression.relics[id]||'start';
  if(task==='deferred')return false;
  return task==='start'||!!state(m).tasks[task]||!!state(m).seen['relic:'+id];
 }
 function spPlan(m,r,reason){
  const g=region(r),row=config().economy.sp[g]||config().economy.sp.E,x=progress(r),e=config().economy;
  if(challenge(r)||r.valid===false||(!x.packs&&reason!=='boss'))return {sp:0,first:0,stage:'void'};
  if(['death','wipe','invalid','void'].includes(reason))return {sp:0,first:0,stage:'wipe'};
  if(reason==='boss'){
   const main=!r.campaign||r.campaign.mission==='main';
   const first=main&&!state(m).firstClears[g]&&!m.cleared?.[g]?row[3]:0;
   return {sp:row[2],first,stage:'clear'};
  }
  const middle=x.packs>=e.middlePacks&&x.sites>=e.middleSites&&integer(r.camps)>=e.middleCamps;
  return {sp:middle?row[1]:x.packs>=e.quickPacks?row[0]:0,first:0,stage:middle?'middle':'quick'};
 }
 function runKey(m,r){
  return String(r.runId||r.campaign?.id||('legacy:'+integer(m.runs)));
 }
 const alreadySettled=(m,r)=>!!state(m).settled[runKey(m,r)];
 function claim(m,r,source,amount,opts={}){
  if(challenge(r))return false;const p=state(m),key=runKey(m,r)+':'+source;
  if(p.claims[key])return false;p.claims[key]=true;
  p.ledger.push({runId:runKey(m,r),source,first:!!opts.first,uid:opts.uid||key,
   cap:opts.cap??null,amount:{...amount},region:region(r)});
  return true;
 }
 function settlement(m,r,reason){
  const p=state(m),key=runKey(m,r),plan=spPlan(m,r,reason);
  if(p.settled[key])return {...p.settled[key],duplicate:true,sp:0,res:{}};
  const res={},x=progress(r),e=config().economy;
  if(!challenge(r)&&r.valid!==false&&['camp','boss'].includes(reason)){
   if(x.packs>=e.middlePacks&&x.sites>=e.middleSites&&integer(r.camps)>=e.middleCamps){
    Object.assign(res,e.objectiveBonus);
   }
   if(reason==='boss'||(x.packs>=e.deepPacks&&integer(r.camps)>=e.deepCamps)){
    for(const [k,n] of Object.entries(e.deepBonus))res[k]=(res[k]||0)+n;
   }
  }
  const out={...plan,sp:plan.sp+plan.first,res,runId:key,region:region(r)};
  if(claim(m,r,'depth-sp',{sp:plan.sp},{cap:config().economy.sp[region(r)]?.[2]})){
   if(plan.first)claim(m,r,'first-clear-sp',{sp:plan.first},{first:true,uid:'clear:'+region(r),cap:1});
   if(Object.keys(res).length)claim(m,r,'depth-materials',res,{cap:1});
  }
  if(reason==='boss'&&(!r.campaign||r.campaign.mission==='main')&&!challenge(r)){

 function growthCost(m,student,lv){
  const cost=ECON.growthCost(lv,student.school,student.role);if(!cost)return null;
  const p=state(m),index=Math.max(0,...regions().map((g,i)=>introduced(m,g)?i:0));
  const target=config().economy.catchupLevel[index]||0;
  if(lv<=target&&p.recruited[student.id]){
   const discounted={};
   for(const [k,n] of Object.entries(cost)){
    // Shared foundation training uses current guild records, avoiding a return to obsolete school tiers.
    const key=k.startsWith('book_')?'rec':k.startsWith('core_')?'part':k;
    discounted[key]=(discounted[key]||0)+Math.max(1,Math.ceil(n*config().economy.catchupDiscount));

 function migrateInvestments(m){

   const st=STUDENTS.find(s=>s.id===id);if(!st)continue;
   for(const [lv,old] of Object.entries(object(levels))){
    if(+lv>number(m.growthLv?.[id]))continue;const now=growthCost(m,st,+lv);if(!now)continue;
    const kept={};
    for(const [k,n] of Object.entries(object(old))){
     if(!ECON.defOf(k))continue;
     const replacement=k.startsWith('book_')&&now.rec!=null?now.rec:
      k.startsWith('core_')&&now.part!=null?now.part:now[k];
     const delta=Math.max(0,number(n)-number(replacement));kept[k]=number(n)-delta;
     refund[k]=(refund[k]||0)+delta;
    }
    levels[lv]=kept;
   }
  }
  if(typeof SKILLS!=='undefined'&&typeof skillCostRes==='function'){
   for(const id of m.skills||[]){
    const st=SKILLS.find(s=>s.id===id),old=m.skillPaid?.[id];if(!st||!old)continue;
    const now=skillCostRes(st);
    refund.sp=(refund.sp||0)+Math.max(0,number(old.sp)-number(now.sp));
    m.skillPaid[id]={...old,sp:Math.min(number(old.sp),number(now.sp))};
   }
  }
  if(typeof FACILITIES!=='undefined'&&typeof facCost==='function'){
   for(const [id,levels] of Object.entries(object(m.facilityPaid))){
    const facility=FACILITIES.find(f=>f.id===id);if(!facility)continue;
    for(const [lv,old] of Object.entries(object(levels))){
     if(+lv>number(m.upg?.[id]))continue;const now=facCost(facility,+lv-1);
     for(const [k,n] of Object.entries(object(old))){
      if(ECON.defOf(k))refund[k]=(refund[k]||0)+Math.max(0,number(n)-number(now[k]));
     }
     levels[lv]={...now};
    }
   }
  }
  m.sp=number(m.sp)+number(refund.sp);

  for(const [k,n] of Object.entries(refund))if(k!=='sp')m.res[k]=number(m.res[k])+n;

 function recipeStatus(m,id){

  const first=recruited(m,'yerin')&&!p.firstRecipe;

  m.res=m.res||{};for(const [k,n] of Object.entries(st.cost))m.res[k]-=n;

 function craftStatus(m,r,id){

  if(challenge(r))return {ok:false,reason:'도전에서는 고정 보급 사용',cost};

  if(r.recipeCraftLap===r.lap)return {ok:false,reason:'이번 캠프 제작 완료',cost};

  lockHint,systemOpen,relicOpen,spPlan,settlement,claim,growthCost,migrateInvestments,recipeStatus,

<script>

  'bf_capacitor','bf_dispatch','bf_beacon','sd_cocoon','sd_manor','sd_field','sd_lamp','sd_blood',

   fixedCards:[],freeCards:[],allowedCards:[]};

 function validateDraft(m,region,leaderId,freeCards){

   }
  }
  // 기존 위스프/계약 공급은 유지. 신규 공통 보상은 넘치면 OP로 바꾸지 않는다.
  for(let i=0;i<old;i++)drawCard();
  if(bonus){const id=drawFromDeck();if(run.hand.length<handMax())addToHand(id);}
  const available=pool().filter(id=>!run.deckList.includes(id)&&!s.found.includes(id));
  if(l.packs>=config().discoveryPacks&&l.finds<config().discoveriesPerLoop&&available.length){
   const id=available[Math.floor(rng()*available.length)];l.finds++;remember(id);
   if(run.hand.length<handMax())addToHand(id);
   note('discovery',{id,source:'combat',pack:pk.uid});
   log(`🃏 전투 발견: ${CARDS[id].name} · 캠프에서 이번 원정 덱에 교체 가능`,'good');
  }
  note('drop',{pack:pk.uid,old,bonus,dry:s.dry});
  return old+bonus;
 }
 function relicFound(id){
  if(!active())return;
  const s=init(),r=META_V2_CONFIG.relics?.relics.find(d=>d.id===id);
  if(r?.role==='pivot'&&r.pivotTags?.length){
   s.pivot={id,tags:r.pivotTags.slice()};
   if(s.shop&&s.shop.lap===run.lap)s.shop.pivotOffer=null;
  }
 }
 function makeOffers(revision){
  const s=init(),rng=seedRng('draft-shop:'+run.lap+':'+revision),all=pool(),out=[];
  const current=new Set(run.deckList.flatMap(tags));
  const pickFrom=(ids,role)=>{
   const candidates=ids.filter(id=>!out.some(o=>o.id===id));
   if(!candidates.length)return;
   const id=candidates[Math.floor(rng()*candidates.length)];
   out.push({id,role,price:collectionShopPrice(),sold:false});
  };
  const found=s.found.filter(id=>legal(id)&&!run.deckList.includes(id));
  pickFrom(found.length?found:all.filter(id=>tags(id).some(t=>current.has(t))),'빌드 보강');
  pickFrom(all.filter(id=>CARDS[id].gate===gate().id),'지역 대응');
  while(out.length<config().offers&&out.length<all.length)pickFrom(all,'새 조합');
  return out;
 }
 function shop(){
  if(!active()||run.shop?.kind!=='camp')return null;
  const s=init();
  if(!s.shop||s.shop.lap!==run.lap)s.shop={lap:run.lap,revision:0,replenished:0,
   replaced:0,upgraded:0,redrawn:0,pivotOffer:null,offers:makeOffers(0)};
  const sh=s.shop;
  if(s.pivot&&!s.pivotUsed&&!sh.pivotOffer){
   const choices=pool().filter(id=>!run.deckList.includes(id)&&tags(id).some(t=>s.pivot.tags.includes(t)));
   const rng=seedRng('pivot:'+s.pivot.id+':'+run.lap);
   if(choices.length)sh.pivotOffer={id:choices[Math.floor(rng()*choices.length)],sold:false,
    role:'유물 전환',price:config().pivotReplaceCost};
  }
  return sh;
 }
 function spend(cost,action,budget='supply'){
  run.op-=cost;run.purchases=(run.purchases||0)+1;run.shop.buys=(run.shop.buys||0)+1;
  run.shop.paidHere=(run.shop.paidHere||0)+cost;
  if(cost===0)run.shop.freeHere=(run.shop.freeHere||0)+1;
  regularCheck(cost);
  dispatchRuleEvent('purchase',{paid:cost,amount:cost,budget,source:'draft-'+action,
   campId:run.runId+':camp:'+run.camps,rerolled:false});
  note(action,{cost});dirty=true;
 }
 function replaceBlock(id,index){
  const sh=shop();
  if(!camp()||!sh)return '캠프에서 정비할 수 있습니다';
  if(sh.replaced>=config().replacePerCamp)return '이번 캠프 덱 교체 완료';
  if(!Number.isInteger(index)||index<4||index>=run.deckList.length)return '교체할 자유 카드를 선택하세요';
  if(!legal(id))return '현재 사용할 수 없는 카드';
  if(id===run.deckList[index])return '같은 카드입니다';
  if(run.deckList.filter(x=>x===id).length>=DECK_DUP_MAX)return '같은 카드는 최대 3장';
  return '';
 }
 function replace(id,index,cost){
  if(replaceBlock(id,index)||run.op<cost)return false;
  const old=run.deckList[index],remaining=(run.deck||[]).indexOf(old);
  run.deckList[index]=id;
  if(remaining>=0)run.deck[remaining]=id;
  else if(run.deck)run.deck.unshift(id);
  shop().replaced++;remember(id);spend(cost,'replace');
  note('deck-change',{from:old,to:id,index});
  log(`🃏 원정 덱 교체: ${CARDS[old].name} → ${CARDS[id].name} · 이후 드랍에 반영`,'shop');
  return true;
 }
 /* discard: 손패가 가득 찼을 때 대신 뺄 손패 칸(캠프 상점에서 고른다 — 지정 보충과 같은 방식). 없으면 가득 찬 손패엔 못 산다 */
 function buy(index,slot,discard=-1){
  const sh=shop(),offer=index==='pivot'?sh?.pivotOffer:sh?.offers[index];
  if(!camp()||!offer||offer.sold)return false;
  if(Number.isInteger(slot)){
   const cost=index==='pivot'?config().pivotReplaceCost:config().replaceCost;
   if(!replace(offer.id,slot,cost))return false;
  }else{
   if(index==='pivot'||!legal(offer.id)||run.op<offer.price)return false;
   if(run.hand.length>=handMax()){
    if(!Number.isInteger(discard)||!run.hand[discard])return false;
    run.hand.splice(discard,1);
   }
   spend(offer.price,'hand');remember(offer.id);addToHand(offer.id,true);
  }
  offer.sold=true;if(index==='pivot')init().pivotUsed=true;return true;
 }
 function register(id,slot){
  if(!init()?.found.includes(id))return false;
  return replace(id,slot,config().replaceCost);
 }
 function replenishBlock(id,discard=-1){
  const sh=shop();if(!camp()||!sh)return '캠프에서 보충할 수 있습니다';
  if(sh.replenished>=config().replenishPerCamp)return '이번 캠프 보충 완료';
  if(!run.deckList.includes(id))return '현재 원정 덱에서 선택하세요';
  if(run.hand.length>=handMax()&&(!Number.isInteger(discard)||!run.hand[discard]))return '바꿀 손패를 선택하세요';
  const cost=replenishPrice();if(run.op<cost)return 'OP 부족';return '';
 }
 function replenishPrice(){
  const s=init();return !s.emergencyUsed&&s.packs>0&&!(run.discards>0)
   &&run.hand.length===0&&run.op<config().replenishCost?0:
   config().replenishCost;
 }
 function replenish(id,discard=-1){
  if(replenishBlock(id,discard))return false;
  const cost=replenishPrice();if(cost===0)init().emergencyUsed=true;
  if(run.hand.length>=handMax())run.hand.splice(discard,1);
  shop().replenished++;spend(cost,'replenish');addToHand(id,true);
  log(`🃏 지정 보충: ${CARDS[id].name} · ${cost} OP (손패)`,'shop');return true;
 }
 function redraw(){
  const sh=shop();
  if(!camp()||sh.redrawn>=config().redrawPerCamp||run.op<config().redrawCost
   ||sh.offers.some(o=>o.sold))return false;
  spend(config().redrawCost,'redraw');sh.redrawn++;sh.revision++;
  sh.offers=makeOffers(sh.revision);return true;
 }
 function upgradeQuote(index){
  const sh=shop(),t=spotAt(index),cost=t&&config().upgradeCost[tileLv(t)-1];
  if(!camp()||!sh||sh.upgraded>=config().upgradePerCamp||!upgradable(t)
   ||!cost||t.enemies?.length||tileBusy(t))return null;
  return {cost,description:upgradeStr(t)};
 }
 function upgrade(index){
  const q=upgradeQuote(index);if(!q||run.op<q.cost)return false;
  const t=spotAt(index);t.lv=tileLv(t)+1;shop().upgraded++;
  run.upgrades=(run.upgrades||0)+1;spend(q.cost,'upgrade','upgrade');
  recomputeChains();run.party.forEach(recalcMember);checkMission();
  log(`⬆ 캠프 정비: ${CARDS[t.card].name} Lv${t.lv} · ${q.cost} OP`,'shop');return true;
 }
 function relocate(from,to){
  if(!camp()||!init().pivotUsed||init().relocated)return false;
  const targets=tacticTargets('relocate',from);
  if(!targets.some(t=>t.i===to)||!tacticTargets('relocate').some(t=>t.i===from))return false;
  const slot=run.tactics.length;run.tactics.push('relocate');
  const ok=useTactic(slot,from,to);
  if(!ok){run.tactics.splice(slot,1);return false;}
  init().relocated=true;note('pivot-relocate',{from,to});return true;
 }
 return {config,active,init,camp,legal,pool,tags,drop,relicFound,shop,replaceBlock,buy,register,
  replenish,replenishBlock,replenishPrice,redraw,upgradeQuote,upgrade,relocate};
})();

<script>
'use strict';
// Permanent research widens choices; each purchased pack still grants exactly one reward.
const PACK_RESEARCH=(()=>{
 const config=()=>META_V2_CONFIG.packResearch;
 const integer=v=>Number.isFinite(+v)?Math.max(0,Math.floor(+v)):0;
 const object=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
 const clone=v=>JSON.parse(JSON.stringify(v));
 const active=r=>!!r&&!r.ended;
 const enabled=()=>typeof econOn==='function'&&econOn();
 const challenge=r=>!!r&&(r.mode==='challenge'||!!r.challenge);
 const key=cr=>String(cr.sid)+'|'+String(cr.oid)+'|'+String(cr.kind);
 const canOpen=cr=>!!cr&&!cr.sold&&!run?.packResearch?.packs?.[key(cr)]?.closed;
 function normalize(m,raw=m){
  const prev=object(raw?.packResearch),levels={};
  for(const [id,track] of Object.entries(config().tracks)){
   levels[id]=Math.min(track.steps.length,integer(prev.levels?.[id]));
  }
  m.packResearch={v:config().version,levels,ledger:Array.isArray(prev.ledger)?prev.ledger.slice():[]};
  return m.packResearch;
 }
 const book=m=>m.packResearch?.v===config().version?m.packResearch:normalize(m);
 function levels(m){
  const saved=book(m).levels||{};
  return Object.fromEntries(Object.entries(config().tracks).map(([id,track])=>
   [id,Math.min(track.steps.length,integer(saved[id]))]));
 }
 function researchStatus(m,id){
  const track=config().tracks[id];if(!track)return null;
  const level=levels(m)[id],step=track.steps[level],max=!step;
  const introduced=step&&META_V2.introduced(m,step.region);
  const learned=step&&!!META_V2.state(m).tasks[step.task];
  const cost=step?{...step.cost}:{};
  const affordable=Object.entries(cost).every(([res,n])=>integer(m.res?.[res])>=n);
  return {id,name:track.name,desc:track.desc,level,max,cost,region:step?.region,
   available:!max&&introduced&&learned,affordable,
   hint:max?'연구 완료':!introduced?step.region+' 지역 소개 후 연구 가능':
    !learned?'유효 교전 2회 후 캠프 귀환으로 연구 소개':'부품·기록으로 영구 연구'};
 }
 function buyResearch(m,id){
  if(!enabled()||(typeof run!=='undefined'&&active(run))||
   (typeof CHALLENGE_V2!=='undefined'&&CHALLENGE_V2.sessionActive()))return false;
  const status=researchStatus(m,id);if(!status?.available||!status.affordable)return false;
  const saved=book(m),level=status.level+1;
  for(const [res,n] of Object.entries(status.cost))m.res[res]-=n;
  saved.levels[id]=level;
  saved.ledger.push({id:'pack-research:'+id+':'+level,track:id,level,cost:{...status.cost},
   source:'permanentResearch',region:status.region,run:integer(m.runs)});
  if(typeof save==='function')save();
  return true;
 }
 function runPlan(r=run,m=meta){
  if(!r)return null;
  const fixed=challenge(r),current=r.packResearch;
  if(current&&current.v===config().version&&current.fixed===fixed)return current;
  const selected=fixed?config().challengeLevels:levels(m);
  r.packResearch={v:config().version,fixed,levels:{...selected},
   rerollLimit:enabled()?config().baseRerolls+integer(selected.reroll):0,
   choiceBonus:enabled()?integer(selected.choices):0,packs:{},log:[]};
  return r.packResearch;
 }
 function viewCount(cr,base){
  const bonus=cr.packResearch?.choiceBonus??runPlan()?.choiceBonus??0;
  return Math.min(config().maxChoices,integer(base)+bonus);
 }
 function candidates(kind,sid,oid,round=0){
  const seed='pack-research:'+config().version+'|'+sid+'|'+oid+'|'+kind+'|'+round;
  const rng=seedRng(seed),previousRandom=Math.random,previousUid=_uid;
  let list;
  // genItem uses the classic random helpers. Isolate this synchronous call and restore all state.
  try{Math.random=rng;list=crateCands(kind,rng);}finally{Math.random=previousRandom;_uid=previousUid;}
  if(kind==='gear'){
   const prefix=hashStr(String(run.seed)+'|'+sid+'|'+oid+'|'+kind+'|'+round);
   return list.map((item,i)=>({...item,id:-(prefix*64+i+1),bought:true}));
  }
  return [...new Set(list)];
 }
 function legal(cr,id){
  const approved=student=>!META_V2_CONFIG.progression.students.some(s=>
   s.id===student&&s.productionApproved===false);
  if(cr.kind==='recruit')return STUDENTS.some(s=>s.id===id&&studentUnlocked(s))&&
   approved(id)&&
   (typeof CHALLENGE_V2==='undefined'||CHALLENGE_V2.studentAllowed(id))&&
   (!recruitedMember(id)||recruitedMember(id).star<3);
  if(cr.kind==='ward')return !!CARDS[id]&&cardOpen(id)&&
   (!CARDS[id].sig||approved(CARDS[id].sig))&&
   (typeof CHALLENGE_V2==='undefined'||CHALLENGE_V2.cardAllowed(id));
  if(cr.kind==='relic')return relicOk(id)&&
   (typeof CHALLENGE_V2==='undefined'||CHALLENGE_V2.relicAllowed(id));
  if(cr.kind==='tactic')return TACTICS.some(t=>t.id===id);
  return cr.kind==='gear'&&!!id&&typeof id==='object';
 }
 function projected(cr,list){
  return crateView({...cr,cands:list.filter(id=>legal(cr,id))});
 }
 function prepare(cr){
  if(!active(run)||!cr)return false;
  const plan=runPlan(),k=key(cr);
  let state=plan.packs[k];
  if(state?.closed)return false;
  if(!state){
   state={v:config().version,key:k,rerollLimit:plan.rerollLimit,choiceBonus:plan.choiceBonus,
    rerolls:0,paid:0,closed:false,rounds:[clone(cr.cands)],history:[]};
   // Store every paid round before revealing the first one. Rendering never consumes random numbers.
   cr.packResearch=state;
   for(let i=1;i<=state.rerollLimit;i++){
    const previous=projected(cr,state.rounds[i-1]);let next=[];
    for(let probe=0;probe<8;probe++){
     next=candidates(cr.kind,cr.sid,cr.oid,i*16+probe);
     if(fingerprint(projected(cr,next))!==fingerprint(previous))break;
    }
    state.rounds.push(next);
   }
   plan.packs[k]=state;
  }
  cr.packResearch=state;cr.cands=state.rounds[state.rerolls];
  cr.view=projected(cr,cr.cands);
  return true;
 }
 function fingerprint(list){
  return JSON.stringify(list.map(id=>typeof id==='object'?{...id,id:0}:id)
   .sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b))));
 }
 function rerollStatus(cr=run?.crateOpen){
  const state=cr?.packResearch;
  if(!active(run)||!enabled()||!cr||run.crateOpen!==cr||!state||state.closed){
   return {ok:false,reason:'개봉 중인 팩에서만 다시 뽑을 수 있습니다',left:0,price:0};
  }
  const left=Math.max(0,state.rerollLimit-state.rerolls),rate=config().rerollRate[state.rerolls]||0;
  const step=config().priceRound,discount=integer(FX().rerollDisc)*integer(BAL.econ.opMul||1);
  const price=Math.max(config().minRerollOp,Math.ceil((integer(cr.paidOp)*rate-discount)/step)*step);
  const next=left?projected(cr,state.rounds[state.rerolls+1]):[];
  const changed=next.length>0&&fingerprint(next)!==fingerprint(cr.view||[]);
  const reason=!left?'이 팩의 리롤을 모두 사용했습니다':!changed?'새로운 후보가 없습니다':
   run.op<price?'OP가 부족합니다':'';
  return {ok:!reason,reason,left,price,nextCount:next.length,used:state.rerolls,limit:state.rerollLimit};
 }
 function reroll(cr=run?.crateOpen){
  const status=rerollStatus(cr);if(!status.ok)return false;
  const state=cr.packResearch,before=clone(cr.view),paid=status.price;
  run.op-=paid;state.rerolls++;state.paid+=paid;
  cr.cands=state.rounds[state.rerolls];cr.view=projected(cr,cr.cands);
  const row={source:'packReroll',packet:state.key,round:state.rerolls,lap:run.lap,
   paid,before,view:clone(cr.view),opAfter:run.op};
  state.history.push(row);runPlan().log.push(row);
  run.purchases=(run.purchases||0)+1;
  if(run.shop){
   run.shop.buys=integer(run.shop.buys)+1;run.shop.paidHere=integer(run.shop.paidHere)+paid;
   run.shop.rerollsHere=integer(run.shop.rerollsHere)+1;
  }
  for(const id of cr.view)if(cr.kind==='relic'){
   const seen=run.relicSeen||(run.relicSeen={});seen[id]=integer(seen[id])+1;
  }
  if(typeof regularCheck==='function')regularCheck(paid);
  dispatchRuleEvent('purchase',{source:'packReroll',budget:'supplyReroll',paid,amount:paid,
   rerolled:true,rerollsHere:run.shop?.rerollsHere||state.rerolls,packet:state.key,
   campId:run.runId+':camp:'+run.camps});
  log('🎲 '+CRATES[cr.kind].name+' 후보 다시 뽑기 · OP −'+paid+' · 남은 '+(status.left-1)+'회','shop');
  dirty=true;
  if(!simMode&&typeof renderCrate==='function')renderCrate();
  if(!simMode&&typeof SFX!=='undefined')SFX.reroll();
  return true;
 }
 function record(cr,action){
  const state=cr?.packResearch;if(!state||state.closed)return false;
  state.closed=true;state.action=action;
  const row={source:action==='pick'?'packChoice':'packSkip',packet:state.key,kind:cr.kind,
   lap:run.lap,paid:integer(cr.paidOp),rerollPaid:state.paid,rerolls:state.rerolls,
   view:clone(cr.view||[]),pick:cr.picked??null};
  runPlan().log.push(row);
  return true;
 }
 return {config,normalize,levels,researchStatus,buyResearch,runPlan,viewCount,candidates,legal,canOpen,
  prepare,rerollStatus,reroll,record};
})();

<script>
'use strict';
// ================= 메타(세이브) =================
const META_KEY='gateloop_proto_v3';
/* §27.6 g 세이브 계약: econ2(재화 개편)는 **새 키에서 새 계정으로** 시작한다 — 이관 없음. 옛 세이브는 지우지 않고 첫 실행 때 한 번 복사해 둔다.
 * 두 경제의 세이브는 섞이지 않는다: 구버전은 옛 키만 읽고 쓰고, econ2 내보내기는 format 2 라 구버전 parseSave 가 거부한다 */
const ECON_KEY='gateloop_econ2',PRE_ECON_KEY=META_KEY+'_pre_econ2';
const econOn=()=>!!(typeof BAL==='object'&&BAL&&BAL.econ2);
const metaKey=()=>riskSaveKey(econOn()?ECON_KEY:META_KEY);
/* v1.0: deck = 리더별 편집 중 자유 목록 {leaderId:[id×0~7]}(미완성 허용) · decks = 리더별 저장 슬롯 3개 {leaderId:[{name,free}|null×3]} · deckSlot = 마지막 사용 슬롯
 * codex = 발견한 변신 타일 {tileId:true} · pauseOnDraw = 카드 획득 시 일시정지(기본 ON) · goal = 목표 조합(타일 id) */

function townRng(seed){let a=seed>>>0;return ()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
/* v1.4 R4: 핀은 귀환 시점에 확정해 meta.town.pins 에 보관한다(townRoll — endRun 의 유효 귀환). 같은 주기에 시설 구매·의뢰로 LooP 랭크가 올라도 재배치되지 않고,

function townPins(){return townSync().pins.filter(p=>STUDENTS.some(s=>s.id===p.stu)&&PLACE_BY_ID[p.place]);}

function townPinsFresh(){
 const rng=townRng(hashStr('town:'+townCycle())),open=DISTRICTS.flatMap(d=>districtOpen(d)?d.places.filter(placeOpen):[]),cnt={},out=[];
 if(!open.length)return out;

<script>
'use strict';
/* ================= v1.1 §19.2 목표 체계 — 작전 과제 · 학원 개발 핀 · 보스 승산 게이지 ================= */
/* 작전 과제: 출격 3단계에서 3개 중 1개를 고르면 nextMission 에 두고 newRun 이 run.mission 으로 옮긴다(meta 에 저장하지 않는다). 고르지 않으면 3개 중 무작위 */
let nextMission=null;
function rollMissions(n=3){const pool=MISSIONS.slice(),out=[];while(out.length<n&&pool.length)out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);return out;}
function missionStatus(r,reason){r=r||run;if(!r||!r.mission)return null;const m=missionOf(r.mission.id);if(!m)return null;let p=[0,1];try{p=m.prog(r,reason);}catch(e){}
 const cur=Math.min(p[0],p[1]),done=r.mission.done||(p[0]>=p[1]&&(!m.end||!!reason));return {m,cur,need:p[1],done,paid:!!r.mission.paid};}
/* 과제 달성 확정(진행 중에도 호출 — 달성 뒤 조건이 풀려도 달성 유지). end:true 과제는 정산(reason)에서만 */
function checkMission(reason){const s=missionStatus(run,reason);if(!s||run.mission.done||!s.done)return false;run.mission.done=true;
 if(!reason){banner('🎖 작전 과제 달성!',`「${s.m.name}」 — 정산에서 ${missionRewardText(s.m,{run})}`,'#fbbf24',2400);log(`🎖 작전 과제 「${s.m.name}」 달성 — 보상은 정산에서 (${missionRewardText(s.m,{run})})`,'good');}return true;}
/* 정산: 달성한 과제 보상은 런당 1회 */
/* Command upgrades use SP; guild materials stay available for buildings. */
function skillCostRes(s){
 const c=skillCost(s),sp=c[0];
 if(!econOn())return {sp,mana:c[1]};
 const table=s.core?BAL.command.coreSp:BAL.command.subSp;
 const converted=typeof META_V2_CONFIG!=='undefined'&&META_V2_CONFIG.economy.convertedSkills.includes(s.id);
 const ratio=converted?META_V2_CONFIG.economy.convertedCostRatio:1;
 return {sp:Math.max(1,Math.ceil(table[Math.max(0,Math.min(3,s.tier-1))]*ratio))};
}
function legacySkillCostRes(s){
 const sp=(s.core?[2,10,22,44]:[1,5,11,22])[s.tier-1];
 const t=Math.max(1,Math.min(4,s.tier|0)),core=!!s.core;
 const rec=core?[1,4,8,16][t-1]:[0,3,6,12][t-1];
 const br=t>=3?(core?[0,0,4,8][t-1]:[0,0,4,8][t-1]):0;
 const kind=s.br==='fire'?'part':s.br==='surv'?'stone':'rec';
 const out={sp};
 if(rec)out.rec=(out.rec||0)+rec;
 if(br)out[kind]=(out[kind]||0)+br;
 return out;
}
function commandNormalize(m){
 if(!econOn()||m.commandBalance>=1)return m;
 m.skillPaid=m.skillPaid||{};m.res=m.res||{};
 for(const id of new Set(m.skills||[])){
  const s=SKILLS.find(x=>x.id===id);if(!s)continue;
  const old=m.skillPaid[id]||legacySkillCostRes(s),cost=skillCostRes(s);
  m.sp+=Math.max(0,(Number(old.sp)||0)-cost.sp);
  for(const [k,n] of Object.entries(old)){
   if(k!=='sp'&&Number.isFinite(n)&&n>0)m.res[k]=(m.res[k]||0)+n;
  }
  m.skillPaid[id]={sp:Math.min(Math.max(0,Number(old.sp)||0),cost.sp)};
 }
 m.commandBalance=1;return m;
}
const skillCostOk=s=>{const c=skillCostRes(s);return meta.sp>=c.sp&&costOk(Object.fromEntries(Object.entries(c).filter(([k])=>k!=='sp')));};
function paySkill(s){commandNormalize(meta);const c=skillCostRes(s);if(!skillCostOk(s))return false;
 meta.sp-=c.sp;payCost(Object.fromEntries(Object.entries(c).filter(([k])=>k!=='sp')));
 meta.skillPaid=meta.skillPaid||{};meta.skillPaid[s.id]=c; /* 구매 당시 비용 — 재설정 환급은 이 값으로(§27.6 g 5) */
 return true;}
const skillCostStr=s=>{const c=skillCostRes(s);return `SP ${c.sp}`+Object.keys(c).filter(k=>k!=='sp').map(k=>` · ${ECON.defOf(k)?ECON.defOf(k).name:k} ${c[k]}`).join('');};
/* §27.6 m 시설 비용(econ2): 종류별 소재. 끔이면 지금처럼 마나석 하나 */
function facCost(f,lv){
 const n=(lv|0)+1;
 if(!econOn())return {mana:f.base*n};
 const cost={...(BAL.facilityCost[f.id]?.[n-1]||{part:5*n})};
 if(typeof META_V2_CONFIG!=='undefined'&&['range','med'].includes(f.id)){
  for(const k of Object.keys(cost))cost[k]=Math.max(1,Math.ceil(cost[k]*META_V2_CONFIG.economy.convertedCostRatio));
 }
 return cost;}

const resHave=k=>((meta.res||{})[k])||0;
const costOk=cost=>Object.keys(cost||{}).every(k=>k==='mana'?meta.mana>=cost[k]:resHave(k)>=cost[k]);
function payCost(cost){if(!costOk(cost))return false;meta.res=meta.res||{};for(const k in cost){if(k==='mana')meta.mana-=cost[k];else meta.res[k]-=cost[k];}return true;}
const costStr=cost=>Object.keys(cost||{}).map(k=>k==='mana'?`💎 ${cost[k]}`:`${ECON.defOf(k)?ECON.defOf(k).name:k} ${cost[k]}`).join(' · ');
/* 시설 구매 — 화면(사무소 · 시설 방) 공용 */
function buyFacility(id){if(typeof officeFacilityOpen==='function'&&!officeFacilityOpen(id))return false;const f=FACILITIES.find(x=>x.id===id);if(!f)return false;const lv=meta.upg[f.id];if(lv>=f.max)return false;
 const cost=facCost(f,lv);if(!payCost(cost))return false;meta.upg[f.id]++;
 meta.facilityPaid=meta.facilityPaid||{};meta.facilityPaid[id]=meta.facilityPaid[id]||{};
 meta.facilityPaid[id][lv+1]={...cost};save();return true;}
/* §27.6 l-4 학생 성장 구매 — 그 학생의 학원 교본 + 역할 코어(높은 Lv 는 기억 조각) */
function growthNext(sid){const st=STUDENTS.find(x=>x.id===sid);if(!st||!econOn()||!studentUnlocked(st))return null;
 const lv=growthLvMeta(sid);if(lv>=ECON.growthMax())return null;
 const cost=typeof META_V2!=='undefined'?META_V2.growthCost(meta,st,lv+1):ECON.growthCost(lv+1,st.school,st.role);return cost?{lv:lv+1,cost,ok:costOk(cost)}:null;}
function buyGrowth(sid){const nx=growthNext(sid);if(!nx||!nx.ok)return false;
 if(!payCost(nx.cost))return false;
 meta.growthLv=meta.growthLv||{};meta.growthLv[sid]=nx.lv;
 meta.growthPaid=meta.growthPaid||{};meta.growthPaid[sid]=meta.growthPaid[sid]||{};
 meta.growthPaid[sid][nx.lv]={...nx.cost};save();return true;}
/* §27.6 a: econ2 의 영구 자원 정산 — 종류마다 비율 → 보스 보너스 → 평가 보너스 → 소수 누적(meta.resFrac).
 * 해금 대기 원장(meta.resPending)의 자원은 그 종류가 열리면 이때 함께 지급한다 */
function econSettleRes(reason,g,eb){
 if(typeof META_V2!=='undefined'&&META_V2.challenge(run))return {};
 if(run.metaV2ResSettled)return run.resPay||{};
 run.metaV2ResSettled=true;
 const first=reason==='boss'&&campaignIsMain(run)&&!meta.cleared[g.id];
 const lootMul=typeof campaignLootMul==='function'?campaignLootMul(run):1;
 const st=ECON.settle({res:run.res||{},lootMul,reason,gate:g.id,evalBonus:supplyOn()?eb.rate:0,frac:meta.resFrac||{},firstClear:first});
 meta.res=meta.res||{};meta.resFrac=st.frac;run.resPay={};
 for(const k in st.grant){if(!st.grant[k])continue;meta.res[k]=(meta.res[k]||0)+st.grant[k];run.resPay[k]=st.grant[k];}

// Road encounters, adjacent facilities, and board variations share one geometry contract.
function tileSpaceAll(state=run){return state?[...(state.tiles||[]),...(state.cells||[])]:[];}

function tileSpaceRoads(c,state=run){

  &&Math.abs(t.r-c.r)<=1).map(t=>t.i);

function tileSpaceSupport(t,state=run){

  .sort((a,b)=>a.i-b.i);

function tileSpaceSquare(c,state=run){

  `기본 HP −${d.selfHpCost*100}%`,[]);

function tileSpaceScore(id,c){

<script>
'use strict';
// Shared, pure recipe eligibility: story completion and discovery are different states.
function recipeRows(){
 return Object.entries(CARDS).filter(([,c])=>c.recipe).map(([id,c])=>({id,...c.recipe}));
}
function recipeFound(id,account=meta){return !!account?.codex?.[id];}
function recipeRecord(id){
 if(!meta.codex[id]){meta.codex[id]=true;run.codexNew.push(id);save();}
}
function recipeStage(id){return CARDS[id]?.recipe?.after||(['ld_oasis','ld_campus'].includes(id)?'E':null);}
function recipeOpen(id,state=run,account=meta){
 const after=recipeStage(id);if(!after)return true;
 if(state?.mode==='challenge'){
  const ranks=['E','D','C','B','A','S'];
  return ranks.indexOf(state.challenge?.rule?.region)>=ranks.indexOf(after);
 }
 return recipeFound(id,account)||!!account?.cleared?.[after];
}
function recipeHint(id){const after=recipeStage(id);return after?`${after} 지역 클리어 후 해금`:'처음부터 발견 가능';}
function recipeIngredient(c,id){
 // Flowering is the same park material, but an already specialised result is not its old base.
 return c?.card===id||(id==='ld_park'&&c?.card==='ld_flower');
}
function recipeMatches(row,c,state=run){
 // 싼 조건(재료 카드·해금)을 먼저 본다. 주변 칸 계산은 재료가 맞는 칸에서만(배치 렉 원인)
 if(c.card!==row.from||!recipeOpen(row.id,state))return false;
 const materials=new Set(tileSpaceAdjacent(c,state).filter(o=>recipeIngredient(o,row.adj))
  .map(o=>o.fp?'fp:'+o.fp.a:'cell:'+o.i));
 return materials.size>=row.need;
}
function recipeSorted(){
 return recipeRows().sort((a,b)=>b.priority-a.priority||a.id.localeCompare(b.id));
}
function recipeCandidate(c,state=run,rows=recipeSorted()){
 return rows.find(row=>row.from===c.card&&recipeMatches(row,c,state));
}
function recipeMorphs(state,onChange){
 // Snapshot all candidates first. Newly created ingredients cannot chain in this transaction.
 const rows=recipeSorted();
 const changes=(state.cells||[]).map(c=>({c,row:recipeCandidate(c,state,rows)})).filter(x=>x.row);
 for(const {c,row} of changes){
  if(mapDeferMorph(state,'off:'+c.k,c.card,row.id))continue;
  const from=c.card;c.base=from;c.card=row.id;
  onChange?.({cell:c.i,from,to:row.id,
   need:`${CARDS[row.from].name} + ${CARDS[row.adj].name} 인접 ${row.need}개`});
 }
}
function recipePenalty(state,key,cap){
 const unique=new Map();
 for(const c of state?.cells||[]){const id=c.fp?'fp:'+c.fp.a:'cell:'+c.i;if(!unique.has(id))unique.set(id,c);}
 return Math.min(Number(BAL.recipeV5?.[cap])||0,
  [...unique.values()].reduce((n,c)=>n+Math.max(0,Number(CARDS[c.card]?.[key])||0),0));
}
function recipePreviewEffects(t,B,fx,warn){
 const id=B.cell[t.k],d=CARDS[id];tileSpacePreviewEffects(id,t,B,fx,warn);
 if(d.field){
  const state=tileSpaceStateB(B),roads=fieldRoads(id,t,state);
  const parts=cardDesc(id).split(' · 대가: ');
  fx('+','범위 지원',parts[0],`도로 ${roads.length}칸`,roads);
  if(d.field.riskAtk)fx('-','교전 시',`해당 이형 공격 +${d.field.riskAtk*100}%`,
   `공격 +${d.field.riskAtk*100}%`,roads);
  if(!roads.length)warn('지원 범위에 도로가 없습니다. 전역 대가는 그대로 적용됩니다');
 }
}

<script>
'use strict';
/* Risk conversion reads the same physical sources and caps as the combat penalty. */
function recipeHazardsAt(state,tile){
 const cfg=BAL.recipeV5||{},number=v=>Math.max(0,Number(v)||0),unique=new Map();
 for(const cell of state?.cells||[])if(cell.card){
  const key=cell.fp?'fp:'+cell.fp.a:'cell:'+cell.i;if(!unique.has(key))unique.set(key,cell);
 }
 const cells=[...unique.values()];
 const sum=(field,cap)=>{
  let left=number(cap);const sources=[];
  for(const cell of cells){const value=Math.min(left,number(CARDS[cell.card]?.[field]));
   if(value>0){sources.push({id:cell.card,index:cell.i,value});left-=value;}}
  return {value:sources.reduce((n,s)=>n+s.value,0),sources};
 };
 const fatigue=sum('selfSlow',cfg.selfSlowCap),frailty=sum('selfHpCost',cfg.selfHpCap);
 const best=new Map(),exposure={value:0,sources:[]};
 if(tile&&!tile.off&&tile.i>0)for(const cell of cells){
  const field=CARDS[cell.card]?.field;
  if(!(field?.riskAtk>0)||!fieldRoads(cell.card,cell,state).includes(tile.i))continue;
  const value=field.riskAtk*cellMul(cell,false,state),old=best.get(cell.card);
  if(!old||old.value<value)best.set(cell.card,{id:cell.card,index:cell.i,value});
 }
 let left=number(BAL.field.riskAtk);
 for(const source of best.values()){
  const value=Math.min(left,source.value);if(!(value>0))continue;
  exposure.sources.push({...source,value});exposure.value+=value;left-=value;
 }
 return {fatigue,frailty,exposure};
}
const RECIPE_RELICS=(()=>{
 const ids=['fatigue_coil','frailty_plate','exposure_seal'];
 const number=v=>Math.max(0,Number(v)||0),tune=id=>BAL.recipeV5?.relics?.[id]||{};
 const nativeOrigin=value=>!value||value==='native';
 const enabled=r=>!!r&&!r.god&&nativeOrigin(r.ruleOrigin);
 function nativePack(r,tile,enemy){
  if(!enemy||enemy.summoned||enemy.boss||!nativeOrigin(enemy.origin))return null;
  const pack=r.packs?.[enemy.packId];
  return pack&&pack.uid===enemy.packId&&pack.tile===tile.i&&pack.reward&&!pack.summoned
   &&nativeOrigin(pack.origin)?pack:null;
 }
 function start(r){
  const b=r?.battle,tile=b?.tile;if(!b||!enabled(r)||b.recipeStarted)return;
  b.recipeStarted=true;const packs=new Map();
  for(const enemy of tile.enemies||[]){
   const pack=nativePack(r,tile,enemy);
   if(pack&&!pack.paid&&pack.alive>0&&enemy.hp>0)packs.set(pack.uid,pack);
  }
  if(!packs.size)return;
  const hazards=recipeHazardsAt(r,tile);b.recipeHazards=hazards;b.recipePacks=[...packs.keys()];
  if(typeof estMode==='undefined'||!estMode)for(const pack of packs.values()){
   pack.recipeProof={battleId:b.battleId,tileIndex:tile.i,hazards,
    enemies:tile.enemies.filter(e=>nativePack(r,tile,e)===pack&&e.hp>0).map(e=>e.uid),
    damage:0,exposure:0,scored:false};
  }
  if((r.relics||[]).includes('frailty_plate')&&hazards.frailty.value>0){
   const cfg=tune('frailty_plate');
   for(const member of r.party||[]){if(member.down)continue;
    const lost=number(member.stu?.hp)*(1+BAL.star*(Math.max(1,number(member.star))-1))
     *(1+.015*Math.max(0,number(r.level)-1))*hazards.frailty.value;
    const value=Math.min(number(cfg.shieldCap),Math.round(lost*number(cfg.shieldPerLostHp)));
    if(value>0)b.shield[member.uid]=(b.shield[member.uid]||0)+value;
   }
  }
 }
 function attackMultiplier(r){
  if(!enabled(r)||!(r.relics||[]).includes('fatigue_coil')||!r.battle?.recipePacks?.length)return 1;
  const cfg=tune('fatigue_coil'),value=recipeHazardsAt(r,r.battle.tile).fatigue.value;
  return 1+Math.min(number(cfg.atkCap),value*number(cfg.atkPerSlow));
 }
 function damage(r,enemy,amount,absorbed,source){
  const b=r?.battle;if(!b||!enabled(r)||source!=='attack'||number(amount)+number(absorbed)<=0)return;
  if(!b.tile.enemies?.includes(enemy))return;
  const pack=nativePack(r,b.tile,enemy),proof=pack?.recipeProof;
  if(!proof||proof.battleId!==b.battleId||!proof.enemies?.includes(enemy.uid)||pack.paid||pack.alive<=0)return;
  const applied=Math.min(number(proof.hazards?.exposure?.value),recipeHazardsAt(r,b.tile).exposure.value);
  if(!(applied>0))return;
  proof.exposure=Math.max(proof.exposure,applied);proof.damage+=number(amount)+number(absorbed);
 }
 function scoreMultiplier(r,event){
  if(!r||r.god||event.origin!=='native'||event.summoned||event.boss)return 10000;
  const pack=r.packs?.[event.packId],proof=pack?.recipeProof;
  if(!pack||!pack.reward||pack.summoned||!nativeOrigin(pack.origin)||!pack.paid||pack.alive>0
   ||String(pack.uid)!==String(event.packId)||!proof||proof.scored||proof.battleId!==event.battleId
   ||!Array.isArray(proof.enemies)||proof.tileIndex!==pack.tile||!(pack.nativeKills>=proof.enemies.length)
   ||!(proof.damage>0)||!(proof.exposure>0)||!proof.enemies.length)return 10000;
  if((r.tiles?.[pack.tile]?.enemies||[]).some(e=>e.hp>0&&proof.enemies.includes(e.uid)))return 10000;
  const cfg=tune('exposure_seal'),steps=Math.floor((proof.exposure+1e-9)/Math.max(.0001,number(cfg.riskStep)));
  return Math.max(10000,Math.min(number(cfg.maxBp),10000+steps*number(cfg.stepBp)));
 }
 function claimScore(r,event){
  const value=scoreMultiplier(r,event);
  if(value>10000)r.packs[event.packId].recipeProof.scored=true;
  return value;
 }
 function describe(id){
  const cfg=tune(id),pct=n=>+(number(n)*100).toFixed(2);
  if(id==='fatigue_coil')return `실제 피로 1%당 교전 공격 +${number(cfg.atkPerSlow)}%`
   +`(최대 +${pct(cfg.atkCap)}%) · 피로 감소 없음`;
  if(id==='frailty_plate')return `취약으로 잃은 기본 HP의 ${pct(cfg.shieldPerLostHp)}%를 시작 보호막으로`
   +`(인당 최대 ${number(cfg.shieldCap)}) · 최대 HP 감소 유지`;
  if(id==='exposure_seal')return `도전 전용 · 노출된 원래 무리의 공격을 실제 피해·보호막으로 견디고 소탕하면`
   +` 적 공격 증가 ${pct(cfg.riskStep)}%당 도전 ×배수 +${number(cfg.stepBp)/10000}`
   +`(최대 ×${number(cfg.maxBp)/10000}) · 무리당 1회`;
  return '';
 }
 return {ids,tune,start,attackMultiplier,damage,scoreMultiplier,claimScore,describe};
})();
if(typeof window==='object')window.RECIPE_RELICS=RECIPE_RELICS;

</script>
<script>
'use strict';
/* ================= 카드 가독성 M — 배치 결과 계약 · 예고 = 실제 (docs/codex-requests/2026-09-20-card-readability.md 추천안 ①의 M · DESIGN §25.2) =================
 * 공통 결과 계약(v1.5 보드 확장 GL.board.preview 와 같은 모양 — 키 이름을 바꾸지 않는다. ui.js 검사 패널 pvHtml · 지도 예고 drawPreviewFx 는 이 키만 읽는다):
 *   ok(놓을 수 있나) · reason(못 놓는 이유) · cardId · formId(배치 형태 — 위치 바리에이션 전에는 cardId) · zone(road|side|land|control) · cells(차지하는 칸)
 *   effects[{text, value(짧은 값), sign:'+'|'-'|'', when(PV_WHEN), cells(영향받는 칸, [] = 지도 전체)}] · morphs[{cell(null = 위치 미정), from, to, delayLaps}]
 *   chainChanges[{id, kind:'form'|'grow'|'upgrade'|'break', from, to(체인 종류 id 또는 null), cells, text}] · cost{breakPct(브레이크 %p), t(T 감소)} · warnings[{text}]
 *   덧붙임(없어도 그려진다): morphs[].name·text(결과 효과)·need(조건)·undiscovered(도감에 없음 — 미발견 조합도 이름·효과 공개, 소유자 결정 2026-09-20)·random · chainChanges[].color · cost.parts[{text,t}]
 * 판정 = resolvePlace(id,spot): placeCard/placeTerrain 의 순서를 덮어쓰기 판(B: 도로·비도로 카드 · 조합 표시 · 지연 변신 · 전초기지 수 · 임계 표시)에서 그대로 돌린다.
 *   도로 카드: 놓기 → landB(= recomputeChains 끝의 recomputeLand: 봉우리 → 꽃밭 → 전초기지(위치 무작위 = cell:null) → 숲속 매점·잔류 사념 → 약탈, 약탈이 있으면 한 번 더)
 *            → 소환 비용 + 격전지 추가 비용(이 시점 체인 — placeCard 와 같은 순간) → 서명 변신 → 조합([놓은 칸, …인접] 차례로 — 앞 결과를 뒤 판정이 본다) → 연쇄 재계산

function trigger(hook,m,ctx){

  if(id==='jiu'){const pr=(run.focusUid&&en.find(e=>e.uid===run.focusUid))||en[0];for(const e of en){if(e.hp<=0)continue;const d=exDmg(e,s.atk*(e===pr?exTune.damage:exTune.splash));floater(p.x,p.y-40,'🗡️ -'+d,'#fcd34d');bsDeal(m,e,d);fxEvent('hit',{e,dmg:d,m,ex:true,row:rowOf(m)});e.hp-=d;if(e.hp<=0)onKill(e,m);if(run.ended||run.state!=='battle')return;}}
  if(id==='yuna')for(const e of en){if(e.hp<=0)continue;const d=exDmg(e,s.atk*exTune.damage);floater(p.x,p.y-40,'🛸 -'+d,'#5eead4');bsDeal(m,e,d);fxEvent('hit',{e,dmg:d,m,ex:true,row:rowOf(m)});e.hp-=d;if(e.hp<=0)onKill(e,m);if(run.ended||run.state!=='battle')return;}
  if(id==='eunha'||id==='seoyoon'){const e=(run.focusUid&&b.tile.enemies.find(x=>x.uid===run.focusUid&&x.hp>0))||b.tile.enemies.find(x=>x.hp>0);if(e){const d=exDmg(e,s.atk*exTune.damage*(id==='eunha'&&!(run.sResist==='crit'&&e.boss)?s.critDmg:1));floater(p.x,p.y-46,(id==='eunha'?'✦ HEADSHOT ':'⚔ 일섬 ')+'-'+d,'#ff6fae');bsDeal(m,e,d);fxEvent('hit',{e,dmg:d,m,ex:true,row:rowOf(m)});e.hp-=d;if(e.hp<=0)onKill(e,m);if(run.ended||run.state!=='battle')return;}}
